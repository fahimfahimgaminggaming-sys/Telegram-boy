        '<div class="fz12 muted">'+esc(u?.email||"?")+' \u00b7 '+fmtTime(t.at)+' \u00b7 '+t.messages.length+' msgs</div></div>';
    }).join(""):'<p class="muted">No tickets</p>';
  },
  adminViewTicket(id){
    const t = DB.data.tickets.find(x=>x.id===id);
    if(!t) return;
    this.openModal("Ticket: "+t.subject,
      t.messages.map(m=>'<div class="chat-msg '+(m.from==="user"?"me":"bot")+'">'+esc(m.text)+'<div class="fz12 muted" style="margin-top:4px">'+fmtTime(m.at)+'</div></div>').join("")+
      '<div class="mt-12"><div class="input-wrap"><input id="adminReply" placeholder="Admin reply..." /></div></div>'+
      '<div class="row mt-8"><button class="btn btn-secondary" onclick="App.closeTicket(\''+t.id+'\')">Close Ticket</button></div>',
      ()=>{
        const reply = ($("#adminReply")?.value||"").trim();
        if(!reply) return Toast.show("Type a reply","error");
        t.messages.push({from:"admin",text:reply,at:Date.now()});
        Notify.push(t.userId,"Ticket reply","Admin replied to: "+t.subject,"\ud83d\udce9");
        DB.save(); Toast.show("Reply sent","success"); this.closeModal(); this.render();
      });
  },
  closeTicket(id){
    const t = DB.data.tickets.find(x=>x.id===id); if(!t) return;
    t.status="closed"; DB.save(); Toast.show("Ticket closed","success"); this.closeModal(); this.render();
  },
  adminBroadcast(){
    return '<div class="glass" style="padding:16px">'+
      '<div class="field"><label class="field-label">Title</label><div class="input-wrap"><input id="bc_title" placeholder="Announcement" /></div></div>'+
      '<div class="field"><label class="field-label">Message</label><div class="input-wrap"><textarea id="bc_body" rows="3" style="resize:vertical"></textarea></div></div>'+
      '<button class="btn btn-primary" onclick="App.sendBroadcast()">Send to all users</button></div>';
  },
  sendBroadcast(){
    const t = ($("#bc_title")?.value||"").trim(), b = ($("#bc_body")?.value||"").trim();
    if(!t||!b) return Toast.show("Fill both","error");
    Notify.broadcast(t,b);
    Toast.show("Broadcast sent to "+DB.data.users.length+" users","success");
  },
  adminSettings(){
    const s = DB.data.settings;
    return '<div class="glass" style="padding:16px">'+
      '<label style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">'+
        '<span>Maintenance mode</span>'+
        '<input type="checkbox" '+(s.maintenance?"checked":"")+' onchange="DB.data.settings.maintenance=this.checked;DB.save();Toast.show(\'Saved\',\'success\')" style="width:auto" /></label>'+
      '<div class="divider"></div>'+
      '<div class="field"><label class="field-label">Referral bonus ($)</label><div class="input-wrap"><input id="ref_bonus" type="number" step="0.1" value="'+(s.referralBonus||1)+'" onchange="DB.data.settings.referralBonus=parseFloat(this.value)||1;DB.save()" /></div></div>'+
      '<button class="btn btn-secondary mt-12" onclick="App.resetFlash()">Reset flash sale timer (24h)</button>'+
      '<button class="btn btn-danger mt-12" onclick="if(confirm(\'Erase ALL data?\')){localStorage.clear();location.reload()}">Wipe all data</button></div>';
  },
  resetFlash(){ DB.data.settings.flashEnd = Date.now()+1000*60*60*24; DB.save(); Toast.show("Reset","success"); },

  /* ---------- MODAL ---------- */
  openModal(title, body, onSave, hideCancel){
    this.closeModal();
    const m = document.createElement("div");
    m.className="modal-backdrop";
    m.innerHTML = '<div class="modal">'+
      '<div class="modal-head"><div class="modal-title">'+esc(title)+'</div><button class="close-btn" onclick="App.closeModal()">\u2715</button></div>'+
      '<div class="modal-body">'+body+'</div>'+
      (onSave||!hideCancel?'<div class="modal-foot">'+
        (!hideCancel?'<button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>':'')+
        (onSave?'<button class="btn btn-primary" id="modalSave">Save</button>':'')+
        (!onSave&&hideCancel?'<button class="btn btn-primary" onclick="App.closeModal()">Close</button>':'')+
      '</div>':'<div class="modal-foot"><button class="btn btn-primary" onclick="App.closeModal();App.go(\'orders\')">View Orders</button></div>');
    m.addEventListener("click",e=>{ if(e.target===m) this.closeModal(); });
    document.body.appendChild(m);
    this.modal = m;
    if(onSave) document.getElementById("modalSave").onclick = onSave;
  },
  closeModal(){ if(this.modal){ this.modal.remove(); this.modal=null; } }
};

document.addEventListener("DOMContentLoaded",()=>{
  try{ App.init(); }
  catch(e){ console.error(e); document.getElementById("loader").classList.add("hide"); document.getElementById("root").innerHTML = '<div class="empty"><div class="empty-icon">\u26a0\ufe0f</div><p>Load error: '+esc(e.message)+'</p><button class="btn btn-secondary mt-12" onclick="localStorage.clear();location.reload()" style="max-width:200px;margin:12px auto">Reset & reload</button></div>'; }
});

window.App = App;
window.Session = Session;
window.DB = DB;
window.Toast = Toast;
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   TRUSTBUY CINEMATIC MOTION SYSTEM v2.0
   GPU-Accelerated · 60FPS · Full Luxury Grade
   ─ Custom Cursor · Ambient Particles · Mouse Glow
   ─ Parallax · Stagger Reveals · Page Transitions
   ─ Depth Layers · Bloom · Micro-interactions
═══════════════════════════════════════════════════════════ */
(function() {
  'use strict';

  var RM = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  /* ── Easing ── */
  function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ════════════════════════════════
     1. LUXURY CUSTOM CURSOR
  ════════════════════════════════ */
  if (!isMobile && !RM) {
    var cursor   = document.getElementById('cx-cursor');
    var ring     = document.getElementById('cx-ring');
    var trail    = document.getElementById('cx-trail');
    var mx = window.innerWidth/2, my = window.innerHeight/2;
    var rx = mx, ry = my, tx = mx, ty = my;

    document.addEventListener('mousemove', function(e) {
      mx = e.clientX; my = e.clientY;
      cursor.style.transform = 'translate3d(calc(' + mx + 'px - 50%), calc(' + my + 'px - 50%), 0)';
    }, { passive: true });

    document.addEventListener('mousedown', function() {
      document.body.classList.add('cursor-active');
      document.body.classList.remove('cursor-hover');
    });
    document.addEventListener('mouseup', function() {
      document.body.classList.remove('cursor-active');
    });

    /* Hover detection for interactive elements */
    var hoverTargets = 'a,button,.card,.chip,.menu-item,.nav-item,.icon-btn,.add-btn,.btn,.faq-item,.list-item,.crypto-item,.stat,.ticket-item,.tab,.auth-tab';
    document.addEventListener('mouseover', function(e) {
      if (e.target.closest(hoverTargets)) document.body.classList.add('cursor-hover');
    }, { passive: true });
    document.addEventListener('mouseout', function(e) {
      if (e.target.closest(hoverTargets)) document.body.classList.remove('cursor-hover');
    }, { passive: true });

    /* Smooth ring & trail follow via rAF */
    function animCursor() {
      rx = lerp(rx, mx, 0.12);
      ry = lerp(ry, my, 0.12);
      tx = lerp(tx, mx, 0.06);
      ty = lerp(ty, my, 0.06);
      ring.style.transform  = 'translate3d(calc(' + rx + 'px - 50%), calc(' + ry + 'px - 50%), 0)';
      trail.style.transform = 'translate3d(calc(' + tx + 'px - 50%), calc(' + ty + 'px - 50%), 0)';
      requestAnimationFrame(animCursor);
    }
    requestAnimationFrame(animCursor);
  } else {
    /* Hide cursor elements on mobile */
    ['cx-cursor','cx-ring','cx-trail'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  /* ════════════════════════════════
     2. MOUSE REACTIVE GLOW
  ════════════════════════════════ */
  if (!isMobile && !RM) {
    var glow = document.getElementById('mouse-glow');
    var gx = window.innerWidth/2, gy = window.innerHeight/2;
    var tgx = gx, tgy = gy;

    document.addEventListener('mousemove', function(e) {
      tgx = e.clientX; tgy = e.clientY;
    }, { passive: true });

    function animGlow() {
      gx = lerp(gx, tgx, 0.07);
      gy = lerp(gy, tgy, 0.07);
      glow.style.transform = 'translate3d(calc(' + gx + 'px - 50%), calc(' + gy + 'px - 50%), 0)';
      requestAnimationFrame(animGlow);
    }
    requestAnimationFrame(animGlow);
  } else {
    var glowEl = document.getElementById('mouse-glow');
    if (glowEl) glowEl.style.display = 'none';
  }

  /* ════════════════════════════════
     3. AMBIENT PARTICLE SYSTEM
  ════════════════════════════════ */
  if (!RM) {
    var canvas = document.getElementById('ambient-canvas');
    var ctx = canvas ? canvas.getContext('2d') : null;

    if (ctx) {
      var W, H;
      var PCOUNT = isMobile ? 28 : 55;
      var particles = [];

      function resizeCanvas() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas, { passive: true });

      /* Particle factory */
      function mkParticle(born) {
        var size = Math.random() * 2.2 + 0.4;
        return {
          x: Math.random() * W,
          y: born ? Math.random() * H : H + 10,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -(Math.random() * 0.5 + 0.15),
          size: size,
          alpha: 0,
          maxAlpha: Math.random() * 0.5 + 0.15,
          life: 0,
          maxLife: Math.random() * 400 + 200,
          hue: Math.random() * 20 + 38, /* gold-amber range */
        };
      }

      for (var i = 0; i < PCOUNT; i++) particles.push(mkParticle(true));

      /* Subtle mouse drift */
      var pmx = W/2, pmy = H/2;
      if (!isMobile) {
        document.addEventListener('mousemove', function(e) {
          pmx = e.clientX; pmy = e.clientY;
        }, { passive: true });
      }

      function drawParticles() {
        ctx.clearRect(0, 0, W, H);

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.life++;

          /* Mouse attraction — very subtle */
          if (!isMobile) {
            var dx = pmx - p.x, dy = pmy - p.y;
            var dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 220) {
              p.vx += (dx / dist) * 0.006;
              p.vy += (dy / dist) * 0.004;
            }
          }

          p.x += p.vx;
          p.y += p.vy;
          /* Dampen velocity */
          p.vx *= 0.995;
          p.vy *= 0.995;

          /* Fade in/out */
          var lifeRatio = p.life / p.maxLife;
          if (lifeRatio < 0.15) {
            p.alpha = (lifeRatio / 0.15) * p.maxAlpha;
          } else if (lifeRatio > 0.75) {
            p.alpha = ((1 - lifeRatio) / 0.25) * p.maxAlpha;
          } else {
            p.alpha = p.maxAlpha;
          }

          /* Draw */
          var grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
          grd.addColorStop(0, 'hsla(' + p.hue + ',72%,62%,' + p.alpha + ')');
          grd.addColorStop(1, 'hsla(' + p.hue + ',72%,62%,0)');
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = grd;
          ctx.fill();

          /* Respawn */
          if (p.life >= p.maxLife || p.y < -20) {
            particles[i] = mkParticle(false);
          }
        }
        requestAnimationFrame(drawParticles);
      }
      requestAnimationFrame(drawParticles);
    }
  } else {
    var c = document.getElementById('ambient-canvas');
    if (c) c.style.display = 'none';
  }

  /* ════════════════════════════════
     4. SCROLL PROGRESS BAR
  ════════════════════════════════ */
  var scrollBar = document.getElementById('scroll-progress');
  if (scrollBar) {
    function updateScrollBar() {
      var el = document.documentElement;
      var scrolled = el.scrollTop || document.body.scrollTop;
      var total = el.scrollHeight - el.clientHeight;
      var pct = total > 0 ? scrolled / total : 0;
      scrollBar.style.transform = 'scaleX(' + pct + ') translateZ(0)';
    }
    window.addEventListener('scroll', updateScrollBar, { passive: true });
  }

  /* ════════════════════════════════
     5. TOPBAR SCROLL STATE
  ════════════════════════════════ */
  var topbar = document.querySelector('.topbar');
  if (topbar) {
    function updateTopbar() {
      var s = window.scrollY || document.documentElement.scrollTop;
      topbar.classList.toggle('scrolled', s > 20);
    }
    window.addEventListener('scroll', updateTopbar, { passive: true });
  }

  /* ════════════════════════════════
     6. HERO PARALLAX
  ════════════════════════════════ */
  if (!isMobile && !RM) {
    function updateHeroParallax() {
      var hero = document.getElementById('hero');
      if (!hero) return;
      var vid  = hero.querySelector('.hero-video');
      if (!vid) return;
      var rect = hero.getBoundingClientRect();
      /* Only active when hero is partially visible */
      if (rect.bottom < 0 || rect.top > window.innerHeight) return;
      var pct  = rect.top / window.innerHeight; /* -1 to 1 roughly */
      var ty   = pct * 40; /* max 40px shift */
      vid.style.transform = 'translate3d(-50%, calc(-50% + ' + ty + 'px), 0)';
    }
    window.addEventListener('scroll', updateHeroParallax, { passive: true });
  }

  /* ════════════════════════════════
     7. STAGGER REVEAL (Intersection Observer)
  ════════════════════════════════ */
  if (!RM && 'IntersectionObserver' in window) {
    var revealObs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var el = entry.target;
          var delay = parseFloat(el.getAttribute('data-delay') || '0');
          setTimeout(function() {
            el.classList.add('revealed');
          }, delay);
          revealObs.unobserve(el);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

    /* Tag elements for reveal after every SPA render */
    function tagRevealElements() {
      /* Cards */
      var cards = document.querySelectorAll('.card:not([data-reveal])');
      cards.forEach(function(el, i) {
        el.setAttribute('data-reveal', 'up');
        el.setAttribute('data-delay', String(i * 55));
        revealObs.observe(el);
      });
      /* Section headers */
      var headers = document.querySelectorAll('.section-header:not([data-reveal])');
      headers.forEach(function(el) {
        el.setAttribute('data-reveal', 'left');
        revealObs.observe(el);
      });
      /* Stat grid items */
      var stats = document.querySelectorAll('.stat:not([data-reveal])');
      stats.forEach(function(el, i) {
        el.setAttribute('data-reveal', 'scale');
        el.setAttribute('data-delay', String(i * 80));
        revealObs.observe(el);
      });
      /* List items */
      var items = document.querySelectorAll('.list-item:not([data-reveal])');
      items.forEach(function(el, i) {
        el.setAttribute('data-reveal', '');
        el.setAttribute('data-delay', String(i * 45));
        revealObs.observe(el);
      });
      /* Glass panels */
      var glass = document.querySelectorAll('.glass:not([data-reveal]):not(.topbar .glass)');
      glass.forEach(function(el, i) {
        el.setAttribute('data-reveal', 'scale');
        el.setAttribute('data-delay', String(i * 60));
        revealObs.observe(el);
      });
      /* Wallet card */
      var wc = document.querySelectorAll('.wallet-card:not([data-reveal])');
      wc.forEach(function(el) {
        el.setAttribute('data-reveal', 'scale');
        revealObs.observe(el);
      });
      /* Menu items */
      var mi = document.querySelectorAll('.menu-item:not([data-reveal])');
      mi.forEach(function(el, i) {
        el.setAttribute('data-reveal', 'left');
        el.setAttribute('data-delay', String(i * 60));
        revealObs.observe(el);
      });
    }

    /* Run on DOMContentLoaded and after SPA renders */
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(tagRevealElements, 200);
    });

    /* Patch App.afterRender to re-tag */
    function patchAppAfterRender() {
      if (window.App && typeof window.App.afterRender === 'function') {
        var _orig = window.App.afterRender.bind(window.App);
        window.App.afterRender = function() {
          _orig();
          setTimeout(tagRevealElements, 80);
        };
      }
    }
    /* Try immediately, then via MutationObserver on root */
    patchAppAfterRender();
    if (!window.App) {
      var _patchObs = new MutationObserver(function() {
        if (window.App) { patchAppAfterRender(); _patchObs.disconnect(); }
      });
      _patchObs.observe(document.body, { childList: true, subtree: false });
    }
  }

  /* ════════════════════════════════
     8. ADD-TO-CART RIPPLE
  ════════════════════════════════ */
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.add-btn');
    if (!btn) return;
    btn.classList.remove('ripple');
    /* Force reflow */
    void btn.offsetWidth;
    btn.classList.add('ripple');
    setTimeout(function() { btn.classList.remove('ripple'); }, 420);
  }, { passive: true });

  /* ════════════════════════════════
     9. PAGE TRANSITION OVERLAY
     Cinematic fade/blur/scale on route changes
  ════════════════════════════════ */
  if (!RM) {
    var pto = document.getElementById('page-transition-overlay');
    var _lastRoute = null;

    function runPageTransition(cb) {
      if (!pto) { if (cb) cb(); return; }
      /* Flash in */
      pto.style.transition = 'opacity .18s ease';
      pto.style.opacity = '1';
      pto.style.pointerEvents = 'all';
      setTimeout(function() {
        if (cb) cb();
        /* Flash out */
        pto.style.transition = 'opacity .35s ease';
        pto.style.opacity = '0';
        pto.style.pointerEvents = 'none';
      }, 180);
    }

    /* Intercept App.go for page transition */
    function patchAppGo() {
      if (window.App && typeof window.App.go === 'function') {
        var _origGo = window.App.go.bind(window.App);
        window.App.go = function(route) {
          var self = this;
          var args = arguments;
          if (route === _lastRoute) { _origGo.apply(self, args); return; }
          _lastRoute = route;
          runPageTransition(function() {
            _origGo.apply(self, args);
          });
        };
      }
    }
    patchAppGo();
    if (!window.App) {
      var _goObs = new MutationObserver(function() {
        if (window.App) { patchAppGo(); _goObs.disconnect(); }
      });
      _goObs.observe(document.body, { childList: true, subtree: false });
    }
  }

  /* ════════════════════════════════
     10. CARD 3D TILT (Desktop only)
  ════════════════════════════════ */
  if (!isMobile && !RM) {
    document.addEventListener('mousemove', function(e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var rect = card.getBoundingClientRect();
      var cx   = rect.left + rect.width / 2;
      var cy   = rect.top  + rect.height / 2;
      var rx   = ((e.clientY - cy) / (rect.height / 2)) * 5;   /* max 5deg */
      var ry   = ((e.clientX - cx) / (rect.width  / 2)) * -5;
      card.style.transform = 'translateY(-6px) scale(1.015) translate3d(0,0,0) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    }, { passive: true });

    document.addEventListener('mouseleave', function(e) {
      var card = e.target.closest('.card');
      if (!card) return;
      card.style.transform = '';
    }, { passive: true, capture: true });

    document.addEventListener('mouseout', function(e) {
      if (!e.target.classList.contains('card')) return;
      e.target.style.transform = '';
    }, { passive: true });
  }

  /* ════════════════════════════════
     11. CINEMATIC NUMBER COUNTERS
     Animate stat values on reveal
  ════════════════════════════════ */
  function animateCounter(el) {
    var target = parseFloat(el.textContent.replace(/[^0-9.]/g, ''));
    if (isNaN(target) || target === 0) return;
    var prefix = el.textContent.match(/^[^0-9]*/) ? el.textContent.match(/^[^0-9]*/)[0] : '';
    var suffix = el.textContent.match(/[^0-9.]+$/) ? el.textContent.match(/[^0-9.]+$/)[0] : '';
    var isFloat = String(target).includes('.');
    var decimals = isFloat ? (String(target).split('.')[1] || '').length : 0;
    var start = 0, dur = 900, startTime = null;

    function step(ts) {
      if (!startTime) startTime = ts;
      var elapsed = ts - startTime;
      var progress = Math.min(elapsed / dur, 1);
      var eased = easeOutExpo(progress);
      var val = start + (target - start) * eased;
      el.textContent = prefix + val.toFixed(decimals) + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  if (!RM && 'IntersectionObserver' in window) {
    var counterObs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var valEl = entry.target.querySelector('.stat-val');
          if (valEl) animateCounter(valEl);
          counterObs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });

    function observeCounters() {
      document.querySelectorAll('.stat:not([data-counter-obs])').forEach(function(el) {
        el.setAttribute('data-counter-obs', '1');
        counterObs.observe(el);
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(observeCounters, 300);
    });
    /* Also hook into afterRender */
    var _origObsCb = window._cinematicAfterRenderCb;
    window._cinematicAfterRenderCb2 = observeCounters;
  }

  /* ════════════════════════════════
     12. LUXURY BLOOM ON GOLD ELEMENTS
  ════════════════════════════════ */
  function addBloom() {
    document.querySelectorAll('.wallet-bal,.brand-mark,.hero-tag,.gold:not(.bloom-element)').forEach(function(el) {
      if (!el.classList.contains('bloom-element')) el.classList.add('bloom-element');
    });
  }
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(addBloom, 150);
  });

  /* ════════════════════════════════
     13. SOFT SHADOW MOTION ON SCROLL
  ════════════════════════════════ */
  if (!RM) {
    var lastScrollY = 0;
    window.addEventListener('scroll', function() {
      var sy = window.scrollY || 0;
      var delta = sy - lastScrollY;
      lastScrollY = sy;
      /* Subtle parallax on background */
      var bg = document.querySelector('.app') || document.body;
      if (bg && !isMobile) {
        bg.style.backgroundPositionY = (sy * 0.04) + 'px';
      }
    }, { passive: true });
  }

  /* ════════════════════════════════
     14. DEPTH LAYERING — Nav & Hero
  ════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', function() {
    var elems = document.querySelectorAll('.topbar,.hero,.bottom-nav');
    elems.forEach(function(el, i) {
      el.classList.add('depth-layer-' + ((i % 3) + 1));
    });
  });

  /* ════════════════════════════════
     15. CINEMATIC LOADER EXIT
  ════════════════════════════════ */
  /* Enhance the existing loader hide with scale */
  var _origLoaderHide = null;
  document.addEventListener('DOMContentLoaded', function() {
    var loader = document.getElementById('loader');
    if (!loader || RM) return;
    /* Wait for loader to be hidden, then animate */
    var loaderObs = new MutationObserver(function() {
      if (loader.classList.contains('hide')) {
        loader.style.transform = 'scale(1.04)';
        loaderObs.disconnect();
      }
    });
    loaderObs.observe(loader, { attributes: true, attributeFilter: ['class'] });
  });

})();

/* ── TrustBuy Cinematic Hero Engine ── */
(function(){
  'use strict';

  var reducedMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var PARTICLE_COUNT = isMobile ? 24 : 48;

  /* ── Spawn particles into #goldParticles container ── */
  function spawnParticles(container) {
    /* Wipe any previously spawned particles (fresh re-render) */
    container.innerHTML = '';
    if (reducedMotion) return;

    var frag = document.createDocumentFragment();
    for (var i = 0; i < PARTICLE_COUNT; i++) {
      var p = document.createElement('span');
      p.className = 'particle';
      var size = Math.random() * 7 + 2;
      /* Spread particles: some start mid-hero, not just bottom */
      var startY = 80 + Math.random() * 40; /* 80%–120% from top */
      p.style.cssText =
        'width:' + size + 'px;' +
        'height:' + size + 'px;' +
        'left:' + (Math.random() * 100) + '%;' +
        'top:' + startY + '%;' +
        'bottom:auto;' +
        'animation-duration:' + (Math.random() * 10 + 7) + 's;' +
        'animation-delay:-' + (Math.random() * 12) + 's;';
        /* Negative delay = starts mid-animation immediately, no blank wait */
      frag.appendChild(p);
    }
    container.appendChild(frag);
  }

  /* ── Boot video: force play after dynamic injection ── */
  function bootVideo(hero) {
    var vid = hero.querySelector('.hero-video');
    if (!vid) return;
    /* Silence console play-promise rejections */
    try {
      var pp = vid.play();
      if (pp && typeof pp.catch === 'function') pp.catch(function(){});
    } catch(e) {}
    /* Hard fallback: if video fails to load, hide it cleanly */
    vid.addEventListener('error', function() {
      vid.style.display = 'none';
    }, { once: true });
  }

  /* ── Main init: called after every home render ── */
  function initCinematicHero() {
    var hero = document.getElementById('hero');
    if (!hero) return;

    var particles = document.getElementById('goldParticles');
    if (particles) spawnParticles(particles);

    bootVideo(hero);
  }

  /* ── Patch App.afterRender — the guaranteed SPA hook ──
     App is defined synchronously above this script tag,
     so window.App is already available here.             */
  if (window.App && typeof window.App.afterRender === 'function') {
    var _origAfterRender = window.App.afterRender.bind(window.App);
    window.App.afterRender = function() {
      _origAfterRender();
      /* Only run on home route where hero exists */
      if (this.route === 'home' || !this.route) {
        /* rAF ensures DOM paint is complete before we query */
        requestAnimationFrame(function() {
          requestAnimationFrame(initCinematicHero);
        });
      }
    };
  } else {
    /* Fallback: MutationObserver in case App isn't ready */
    var _obs = new MutationObserver(function() {
      var hero = document.getElementById('hero');
      if (hero) {
        initCinematicHero();
        /* Keep observing — SPA will re-render hero on route changes */
      }
    });
    _obs.observe(document.getElementById('root') || document.body, {
      childList: true,
      subtree: false
    });
  }

  /* ── Also fire once on DOMContentLoaded for direct home load ── */
  document.addEventListener('DOMContentLoaded', function() {
    requestAnimationFrame(function() {
      requestAnimationFrame(initCinematicHero);
    });
  });

})();
</script>
