<style>
/* ═══════════════════════════════════════════════
   PREMIUM IA-INSPIRED CINEMATIC THEME
   Luxury Black + Gold + Glassmorphism
═══════════════════════════════════════════════ */

/* ── Custom Luxury Cursor ── */
*, *::before, *::after { cursor: none !important; }
#cx-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 12px; height: 12px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%,-50%) translateZ(0);
  transition: width .18s cubic-bezier(.22,.61,.36,1),
              height .18s cubic-bezier(.22,.61,.36,1),
              background .18s,
              opacity .18s;
  mix-blend-mode: screen;
  will-change: transform;
}
#cx-ring {
  position: fixed;
  top: 0; left: 0;
  width: 38px; height: 38px;
  border: 1.5px solid rgba(212,175,55,.55);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%,-50%) translateZ(0);
  will-change: transform;
  transition: width .35s cubic-bezier(.22,.61,.36,1),
              height .35s cubic-bezier(.22,.61,.36,1),
              border-color .25s,
              opacity .3s;
}
#cx-trail {
  position: fixed;
  top: 0; left: 0;
  width: 6px; height: 6px;
  background: rgba(212,175,55,.3);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99997;
  transform: translate(-50%,-50%) translateZ(0);
  will-change: transform;
  filter: blur(1px);
}
body.cursor-hover #cx-cursor { width: 8px; height: 8px; background: #fff; opacity: .9; }
body.cursor-hover #cx-ring { width: 52px; height: 52px; border-color: rgba(212,175,55,.9); }
body.cursor-active #cx-cursor { width: 6px; height: 6px; }
body.cursor-active #cx-ring { width: 28px; height: 28px; border-color: var(--gold); }

/* ── Ambient Particle Canvas ── */
#ambient-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: .55;
  will-change: transform;
  transform: translateZ(0);
}

/* ── Mouse Reactive Glow ── */
#mouse-glow {
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(212,175,55,.07) 0%,
    rgba(212,175,55,.03) 35%,
    transparent 70%);
  pointer-events: none;
  z-index: 2;
  transform: translate(-50%,-50%) translateZ(0);
  will-change: transform;
  filter: blur(2px);
  transition: opacity .6s;
}

/* ── Cinematic Depth Layers ── */
.depth-layer-1 { transform: translateZ(0); will-change: transform; }
.depth-layer-2 { transform: translateZ(0); will-change: transform; }
.depth-layer-3 { transform: translateZ(0); will-change: transform; }

/* ── Luxury Lighting Bloom ── */
.bloom-element {
  position: relative;
  isolation: isolate;
}
.bloom-element::after {
  content: '';
  position: absolute;
  inset: -30%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,175,55,.12) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity .5s;
  z-index: -1;
}
.bloom-element:hover::after { opacity: 1; }

/* ── Stagger Reveal System ── */
[data-reveal] {
  opacity: 0;
  transform: translateY(22px) translateZ(0);
  transition: opacity .65s cubic-bezier(.22,.61,.36,1),
              transform .65s cubic-bezier(.22,.61,.36,1);
  will-change: transform, opacity;
}
[data-reveal].revealed {
  opacity: 1;
  transform: translateY(0) translateZ(0);
}
[data-reveal="scale"] {
  transform: scale(.94) translateZ(0);
}
[data-reveal="scale"].revealed {
  transform: scale(1) translateZ(0);
}
[data-reveal="left"] {
  transform: translateX(-28px) translateZ(0);
}
[data-reveal="left"].revealed {
  transform: translateX(0) translateZ(0);
}
[data-reveal="right"] {
  transform: translateX(28px) translateZ(0);
}
[data-reveal="right"].revealed {
  transform: translateX(0) translateZ(0);
}

/* ── Page Transition Cinematic Fade ── */
#page-transition-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9990;
  pointer-events: none;
  opacity: 0;
  will-change: opacity;
  transform: translateZ(0);
}

/* ── Buttery Smooth Card Physics ── */
.card {
  transition: transform .3s cubic-bezier(.34,1.56,.64,1),
              border-color .3s ease,
              box-shadow .3s ease !important;
  transform-style: preserve-3d;
  will-change: transform;
}
.card:hover {
  transform: translateY(-6px) scale(1.015) translateZ(0) !important;
  box-shadow: 0 20px 50px rgba(212,175,55,.15), 0 8px 20px rgba(0,0,0,.5) !important;
  border-color: rgba(212,175,55,.35) !important;
}
.card:active {
  transform: translateY(-2px) scale(.99) translateZ(0) !important;
  transition-duration: .12s !important;
}

/* ── Micro-interaction: Buttons ── */
.btn {
  transition: transform .2s cubic-bezier(.34,1.56,.64,1),
              opacity .2s,
              box-shadow .2s !important;
  will-change: transform;
  transform: translateZ(0);
}
.btn-primary:hover {
  box-shadow: 0 8px 30px rgba(212,175,55,.45) !important;
  transform: translateY(-2px) translateZ(0) !important;
}
.btn:active {
  transform: scale(.955) translateZ(0) !important;
  transition-duration: .08s !important;
}

/* ── Icon Button Physics ── */
.icon-btn {
  transition: transform .25s cubic-bezier(.34,1.56,.64,1),
              background .2s !important;
  will-change: transform;
  transform: translateZ(0);
}
.icon-btn:hover {
  transform: scale(1.1) translateZ(0) !important;
}
.icon-btn:active {
  transform: scale(.88) translateZ(0) !important;
}

/* ── Navigation Item Transitions ── */
.nav-item {
  transition: color .2s, transform .25s cubic-bezier(.34,1.56,.64,1) !important;
  transform: translateZ(0);
  will-change: transform;
}
.nav-item:active {
  transform: scale(.88) translateZ(0) !important;
}

/* ── Soft Shadow Motion ── */
.glass {
  transition: box-shadow .4s ease, border-color .4s ease !important;
  will-change: box-shadow;
  transform: translateZ(0);
}
.glass:hover {
  box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(212,175,55,.1) !important;
}

/* ── Topbar Cinematic Scroll ── */
.topbar {
  transition: background .4s ease, box-shadow .4s ease,
              backdrop-filter .4s ease !important;
  will-change: background;
  transform: translateZ(0);
}
.topbar.scrolled {
  background: rgba(0,0,0,.88) !important;
  box-shadow: 0 1px 0 rgba(212,175,55,.12), 0 8px 32px rgba(0,0,0,.6) !important;
}

/* ── Cinematic Hero Parallax ── */
.hero {
  transform-style: preserve-3d;
  will-change: transform;
}
.hero-video {
  transition: transform .1s linear !important;
  will-change: transform;
}

/* ── Add-to-cart Ripple ── */
.add-btn {
  position: relative;
  overflow: hidden;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1),
              box-shadow .2s !important;
  will-change: transform;
  transform: translateZ(0);
}
.add-btn:hover {
  transform: scale(1.15) translateZ(0) !important;
  box-shadow: 0 4px 16px rgba(212,175,55,.5) !important;
}
.add-btn::after {
  content: '';
  position: absolute;
  inset: 50%;
  background: rgba(255,255,255,.4);
  border-radius: 50%;
  transform: translate(-50%,-50%) scale(0);
  opacity: 1;
  pointer-events: none;
}
.add-btn.ripple::after {
  animation: btn-ripple .4s ease-out forwards;
}
@keyframes btn-ripple {
  to { inset: -50%; transform: translate(0,0) scale(1); opacity: 0; }
}

/* ── Chip Hover Physics ── */
.chip {
  transition: all .25s cubic-bezier(.34,1.56,.64,1) !important;
  will-change: transform;
  transform: translateZ(0);
}
.chip:hover {
  transform: translateY(-2px) translateZ(0) !important;
  box-shadow: 0 4px 14px rgba(0,0,0,.3) !important;
}

/* ── List Item Hover ── */
.list-item {
  transition: transform .25s cubic-bezier(.34,1.56,.64,1),
              box-shadow .25s ease,
              border-color .25s !important;
  will-change: transform;
  transform: translateZ(0);
}
.list-item:hover {
  transform: translateX(4px) translateZ(0) !important;
  border-color: rgba(212,175,55,.2) !important;
}

/* ── Menu Item Physics ── */
.menu-item {
  transition: background .2s, transform .25s cubic-bezier(.34,1.56,.64,1),
              border-color .2s !important;
  will-change: transform;
  transform: translateZ(0);
}
.menu-item:hover {
  transform: translateX(5px) translateZ(0) !important;
  border-color: rgba(212,175,55,.18) !important;
}

/* ── Cinematic Loader Enhancement ── */
#loader {
  transition: opacity .7s cubic-bezier(.22,.61,.36,1),
              transform .7s cubic-bezier(.22,.61,.36,1) !important;
}
#loader.hide {
  transform: scale(1.04) translateZ(0) !important;
}

/* ── Toast Physics ── */
.toast {
  animation: toast-in .4s cubic-bezier(.34,1.56,.64,1) !important;
  will-change: transform, opacity;
  transform: translateZ(0);
}
@keyframes toast-in {
  from { opacity:0; transform: translateY(-12px) scale(.92) translateZ(0); }
  to   { opacity:1; transform: translateY(0) scale(1) translateZ(0); }
}

/* ── Modal Cinematic Enter ── */
.modal {
  animation: modal-cinema .38s cubic-bezier(.22,.61,.36,1) !important;
  will-change: transform, opacity;
  transform: translateZ(0);
}
@keyframes modal-cinema {
  from { opacity:0; transform: translateY(28px) scale(.96) translateZ(0); }
  to   { opacity:1; transform: translateY(0) scale(1) translateZ(0); }
}
@media(min-width:640px) {
  .modal { animation: modal-cinema-desk .3s cubic-bezier(.22,.61,.36,1) !important; }
  @keyframes modal-cinema-desk {
    from { opacity:0; transform: scale(.9) translateY(10px) translateZ(0); }
    to   { opacity:1; transform: scale(1) translateY(0) translateZ(0); }
  }
}

/* ── Hero Glow Pulse ── */
@keyframes heroGlowPulse {
  0%,100% { opacity:.55; }
  50% { opacity:.8; }
}
.hero-overlay { animation: heroGlowPulse 5s ease-in-out infinite; }

/* ── Gold Shimmer on Brand ── */
.brand-mark {
  transition: box-shadow .3s, transform .25s cubic-bezier(.34,1.56,.64,1) !important;
  will-change: transform;
  transform: translateZ(0);
}
.brand:hover .brand-mark {
  transform: rotate(-8deg) scale(1.1) translateZ(0) !important;
  box-shadow: 0 6px 24px rgba(212,175,55,.4) !important;
}

/* ── Flash Badge Pulse ── */
.flash-icon { animation: flash-badge-pulse 2s ease-in-out infinite; }
@keyframes flash-badge-pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* ── Stat Cards Hover ── */
.stat {
  transition: transform .25s cubic-bezier(.34,1.56,.64,1),
              box-shadow .25s,
              border-color .25s !important;
  will-change: transform;
  transform: translateZ(0);
}
.stat:hover {
  transform: translateY(-4px) translateZ(0) !important;
  border-color: rgba(212,175,55,.2) !important;
  box-shadow: 0 12px 32px rgba(0,0,0,.4) !important;
}

/* ── Scroll Progress Indicator ── */
#scroll-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-2));
  z-index: 9999;
  pointer-events: none;
  transform-origin: left;
  transform: scaleX(0) translateZ(0);
  will-change: transform;
  box-shadow: 0 0 8px rgba(212,175,55,.6);
}

/* ── Cinematic Section Divider ── */
.section-header {
  transition: opacity .3s !important;
  will-change: opacity;
}

/* ── Reduce Motion Respect ── */
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity:1 !important; transform:none !important; transition:none !important; }
  #ambient-canvas, #mouse-glow, #cx-cursor, #cx-ring, #cx-trail { display:none !important; }
  .card, .btn, .chip, .list-item, .menu-item { transition: none !important; }
}
</style>

<style>
:root{
  --bg:#000;
  --bg-2:#0a0a0a;
  --surface:rgba(15,15,17,.68);
  --surface-2:rgba(25,25,28,.75);
  --border:rgba(255,255,255,.06);
  --border-2:rgba(212,175,55,.18);
  --text:#f5f5f7;
  --text-2:#a1a1a6;
  --muted:#6e6e73;
  --gold:#d4af37;
  --gold-2:#f0d78c;
  --gold-soft:rgba(212,175,55,.08);
  --danger:#ff453a;
  --success:#30d158;
  --info:#0a84ff;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body{background:radial-gradient(1400px 900px at 80% -10%,rgba(212,175,55,.06),transparent 60%),radial-gradient(1000px 700px at -10% 100%,rgba(212,175,55,.04),transparent 60%),#000;padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:transparent;border:none;outline:none;width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}

/* Loading */
#loader{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s var(--ease)}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{font-size:42px;font-weight:800;letter-spacing:-1px;font-family:'Instrument Serif',serif;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px;animation:pulse 1.6s ease-in-out infinite}
.loader-ring{width:42px;height:42px;border:2px solid rgba(212,175,55,.12);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes goldGlow{0%,100%{box-shadow:0 0 20px rgba(212,175,55,.2)}50%{box-shadow:0 0 40px rgba(212,175,55,.4),0 0 80px rgba(212,175,55,.15)}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes skeletonShine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes checkmark{0%{stroke-dashoffset:50}100%{stroke-dashoffset:0}}

/* Glass */
.glass{background:var(--surface);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.glass-gold{background:var(--surface);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid var(--border-2);border-radius:var(--radius);animation:goldGlow 3s ease-in-out infinite;box-shadow:0 8px 32px rgba(212,175,55,.08)}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(0,0,0,.5);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px;font-family:'Instrument Serif',serif}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1c1c1e,#000);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;border:1px solid rgba(212,175,55,.2);box-shadow:0 8px 24px rgba(212,175,55,.12)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--border);transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.icon-btn:hover{background:rgba(255,255,255,.08);box-shadow:0 4px 12px rgba(212,175,55,.1)}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #000}
.icon-wrap{position:relative}

/* Main */
.app{padding:18px 18px 110px;max-width:1100px;margin:0 auto;animation:fadeIn .4s var(--ease)}
.page{animation:fadeUp .35s var(--ease)}

/* Hero / banner slider */
.hero{
border-radius:24px;
overflow:hidden;
position:relative;
margin-bottom:24px;
min-height:420px;
background:#000;
border:1px solid var(--border-2);
isolation:isolate;
box-shadow:0 12px 48px rgba(212,175,55,.08);
}

.hero-video{
position:absolute;
top:50%;
left:50%;
width:120%;

opacity:.45;
will-change:transform;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
transform-style:preserve-3d;
transition:opacity 1.2s ease;
}
@media(prefers-reduced-motion:reduce){
.hero-video{display:none}
}

.hero-overlay{

inset:0;
background:

rgba(212,175,55,.1),
transparent 60%),
radial-gradient(ellipse 60% 40% at 20% 80%,

transparent 55%),
linear-gradient(
180deg,
rgba(0,0,0,.1),
rgba(0,0,0,.7)
);
z-index:1;
}

.gold-particles{

inset:0;
pointer-events:none;
z-index:2;
overflow:hidden;
}

.particle{
position:absolute;
border-radius:50%;
background:radial-gradient(
circle,
rgba(240,215,140,.95) 0%,

transparent 75%
);

filter:blur(.3px);

-webkit-backface-visibility:hidden;

}

@keyframes floatGold{
0%{

}
8%{opacity:.9}
90%{opacity:.7}
100%{

}
}
@media(prefers-reduced-motion:reduce){
.particle{animation:none!important;display:none!important}
}

.hero-content{
position:relative;
z-index:5;
}
.hero-slides{display:flex;transition:transform .6s var(--ease);height:100%}
.hero-slide{min-width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;position:relative;background-size:cover;background-position:center}
.hero-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.88))}
.hero-slide>*{position:relative;z-index:1}
.hero-tag{display:inline-block;padding:7px 14px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.25);border-radius:999px;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px;width:fit-content}
.hero-title{font-size:clamp(24px,5vw,36px);font-weight:800;letter-spacing:-.6px;margin:0 0 8px;max-width:85%;font-family:'Instrument Serif',serif}
.hero-sub{color:var(--text-2);font-size:15px;margin:0;max-width:85%;line-height:1.5}
.hero-dots{position:absolute;bottom:16px;right:20px;display:flex;gap:6px;z-index:2}
.hero-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);transition:all .3s}
.hero-dot.active{width:24px;background:var(--gold)}

/* Flash sale */
.flash{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;margin-bottom:20px;border-radius:18px;background:linear-gradient(135deg,rgba(255,69,58,.12),rgba(212,175,55,.06));border:1px solid rgba(255,69,58,.2);box-shadow:0 4px 16px rgba(255,69,58,.08)}
.flash-left{display:flex;align-items:center;gap:12px}
.flash-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,69,58,.15);font-size:20px}
.flash-title{font-weight:700;font-size:15px}
.flash-sub{font-size:13px;color:var(--text-2)}
.flash-timer{display:flex;gap:4px}
.flash-cell{background:#000;border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:34px;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin:28px 4px 16px}
.section-title{font-size:20px;font-weight:700;letter-spacing:-.4px;margin:0;font-family:'Instrument Serif',serif}
.section-link{font-size:13px;color:var(--gold);font-weight:500}

/* Search */
.search-bar{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:20px;transition:border-color .2s,box-shadow .2s}
.search-bar:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.1)}
.search-bar svg{flex:0 0 18px;color:var(--text-2)}
.search-bar input{flex:1;font-size:15px}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .2s var(--ease);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600;box-shadow:0 4px 16px rgba(212,175,55,.3)}
.chip:active{transform:scale(.95)}

/* Sort */
.sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:13px;color:var(--text-2)}
.sort-select{padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:13px;width:auto;cursor:pointer}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.card:hover{transform:translateY(-4px);border-color:rgba(212,175,55,.2);box-shadow:0 12px 36px rgba(212,175,55,.12),0 4px 16px rgba(0,0,0,.4)}
.card-img{aspect-ratio:1;background:#111 center/cover no-repeat;position:relative;overflow:hidden}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5))}
.card-fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:18px;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .2s,background .2s;border:1px solid rgba(255,255,255,.1)}
.card-fav.active{color:var(--danger);background:rgba(255,69,58,.2)}
.card-fav:active{transform:scale(.85)}
.card-stock{position:absolute;top:10px;left:10px;padding:5px 10px;background:rgba(48,209,88,.15);border:1px solid rgba(48,209,88,.3);border-radius:8px;font-size:10px;font-weight:600;color:var(--success);z-index:2}
.card-stock.out{background:rgba(255,69,58,.15);border-color:rgba(255,69,58,.3);color:var(--danger)}
.card-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-title{font-size:14px;font-weight:600;line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.card-rating{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2)}
.card-rating .star{color:var(--gold)}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.card-price{font-size:17px;font-weight:800;color:var(--gold)}
.card-price small{font-size:11px;color:var(--muted);font-weight:400;text-decoration:line-through;margin-left:4px}
.add-btn{width:36px;height:36px;border-radius:11px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(212,175,55,.3)}
.add-btn:active{transform:scale(.85)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(5,5,5,.92);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-top:1px solid var(--border)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;color:var(--text-2);font-size:10px;font-weight:500;border-radius:12px;transition:color .2s;position:relative}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px}
.nav-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--gold);border-radius:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:600;font-size:15px;transition:transform .15s var(--ease),opacity .2s,box-shadow .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;box-shadow:0 8px 28px rgba(212,175,55,.35);font-weight:700}
.btn-secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--text);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn-danger{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:var(--danger)}
.btn-success{background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.3);color:var(--success)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn:disabled{opacity:.5;pointer-events:none}

/* Auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .5s var(--ease)}
.auth-card{width:100%;max-width:440px;padding:36px 28px;border-radius:26px;background:var(--surface);backdrop-filter:blur(32px);border:1px solid var(--border-2);box-shadow:0 12px 48px rgba(0,0,0,.4)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand-mark{margin:0 auto 16px;width:56px;height:56px;font-size:26px;border-radius:14px}
.auth-logo h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:0 0 6px;font-family:'Instrument Serif',serif}
.auth-logo p{color:var(--text-2);font-size:14px;margin:0}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:11px;border-radius:10px;font-weight:600;font-size:14px;color:var(--text-2);transition:all .25s}
.auth-tab.active{background:var(--gold);color:#000}
.field{margin-bottom:16px}
.field-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:7px;font-weight:600;padding-left:4px;letter-spacing:.3px;text-transform:uppercase}
.input-wrap{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:13px 15px;transition:border-color .2s,box-shadow .2s}
.input-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.1)}
.input-wrap svg{flex:0 0 18px;color:var(--text-2)}
.eye-btn{flex:0 0 auto;color:var(--text-2);padding:2px}
.pwd-strength{height:4px;border-radius:2px;margin-top:7px;background:var(--surface-2);overflow:hidden}
.pwd-strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--text-2)}
.remember-row input{width:auto}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s var(--ease)}
@media(min-width:640px){.modal-backdrop{align-items:center}}
.modal{width:100%;max-width:540px;max-height:90vh;background:var(--surface);border:1px solid var(--border);border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .35s var(--ease);box-shadow:0 20px 60px rgba(0,0,0,.5)}
@media(min-width:640px){.modal{border-radius:26px;animation:scaleIn .25s var(--ease)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700;margin:0;font-family:'Instrument Serif',serif}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{padding:18px 22px;border-top:1px solid var(--border);display:flex;gap:10px}
.close-btn{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .2s}
.close-btn:hover{background:rgba(255,255,255,.08)}

/* Toast */
#toast-host{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.toast{padding:14px 18px;border-radius:16px;background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border);font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:fadeUp .3s var(--ease);display:flex;align-items:center;gap:10px}
.toast.success{border-color:rgba(48,209,88,.3);color:var(--success)}
.toast.error{border-color:rgba(255,69,58,.3);color:var(--danger)}
.toast.info{border-color:var(--border-2);color:var(--gold)}

/* Wallet */
.wallet-card{padding:26px;border-radius:24px;background:linear-gradient(135deg,rgba(212,175,55,.08) 0%,rgba(212,175,55,.02) 100%);border:1px solid var(--border-2);position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 8px 32px rgba(212,175,55,.08)}
.wallet-card::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.12),transparent 70%);top:-100px;right:-80px}
.wallet-label{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:10px;position:relative}
.wallet-bal{font-size:38px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px;position:relative;margin-bottom:16px;font-family:'Instrument Serif',serif}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;position:relative}

/* Crypto methods */
.crypto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:20px}
.crypto-item{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:center;transition:all .2s var(--ease);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.crypto-item:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,175,55,.1)}
.crypto-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.crypto-name{font-weight:700;font-size:13px}
.crypto-net{font-size:11px;color:var(--text-2);margin-top:3px}

/* Deposit page */
.deposit-warn{padding:13px 15px;border-radius:14px;background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.2);color:#ff9f0a;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.qr-box{display:flex;justify-content:center;padding:20px;background:#fff;border-radius:20px;margin:16px auto;width:fit-content;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.addr-box{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;margin-bottom:14px;word-break:break-all;font-family:'SF Mono',Menlo,monospace;font-size:12px}
.copy-btn{flex:0 0 auto;padding:9px 13px;background:var(--gold);color:#000;border-radius:9px;font-weight:700;font-size:12px}
.upload-zone{padding:26px;border:2px dashed var(--border);border-radius:16px;text-align:center;color:var(--text-2);font-size:13px;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:14px}
.upload-zone:hover{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.04)}
.upload-zone img{margin:12px auto 0;max-width:200px;max-height:200px;border-radius:12px}

/* Deposit status pipeline */
.deposit-pipeline{display:flex;align-items:center;justify-content:center;gap:0;margin:20px 0}
.pipeline-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.pipeline-dot{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .3s;font-weight:700}
.pipeline-dot.active{background:var(--gold);color:#000;border-color:var(--gold);animation:pulse 1.5s infinite;box-shadow:0 0 16px rgba(212,175,55,.4)}
.pipeline-dot.done{background:var(--success);color:#fff;border-color:var(--success)}
.pipeline-label{font-size:11px;color:var(--text-2);text-align:center;max-width:80px}

/* Order/list items */
.list-item{display:flex;align-items:center;gap:13px;padding:15px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:11px;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.list-item:hover{transform:translateX(3px);box-shadow:0 4px 12px rgba(212,175,55,.08)}
.list-img{width:56px;height:56px;border-radius:13px;background:#222 center/cover;flex:0 0 56px}
.list-body{flex:1;min-width:0}
.list-title{font-weight:600;font-size:14px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:var(--text-2)}
.status-pill{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.status-pending{background:rgba(255,159,10,.12);color:#ff9f0a}
.status-completed,.status-approved,.status-delivered{background:rgba(48,209,88,.12);color:var(--success)}
.status-rejected,.status-cancelled,.status-banned{background:rgba(255,69,58,.12);color:var(--danger)}
.status-processing,.status-verifying{background:rgba(10,132,255,.12);color:var(--info)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:20px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border);transition:transform .2s,box-shadow .2s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.stat:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,175,55,.1)}
.stat-label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:8px}
.stat-val{font-size:24px;font-weight:800;letter-spacing:-.5px;font-family:'Instrument Serif',serif}
.stat-val.gold{color:var(--gold)}

/* Chart */
.chart-wrap{padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--border);margin-bottom:20px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.chart-svg{width:100%;height:180px}

/* Profile */
.profile-head{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex-shrink:0;box-shadow:0 6px 20px rgba(212,175,55,.3)}
.menu-list{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.menu-item{display:flex;align-items:center;gap:13px;padding:15px 17px;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:background .2s,transform .2s,box-shadow .2s;text-align:left;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.menu-item:hover{background:var(--surface-2);transform:translateX(3px);box-shadow:0 4px 12px rgba(212,175,55,.08)}
.menu-item svg{flex:0 0 20px;color:var(--gold)}
.menu-item-text{flex:1}
.menu-item-arr{color:var(--text-2)}

/* Cart */
.cart-foot{position:sticky;bottom:80px;background:rgba(5,5,5,.95);backdrop-filter:blur(24px);padding:15px;border:1px solid var(--border);border-radius:20px;margin-top:16px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.cart-total{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:9px}
.cart-total.grand{font-size:19px;color:var(--text);font-weight:800;margin-bottom:14px;font-family:'Instrument Serif',serif}

/* Chat */
.chat-fab{position:fixed;bottom:90px;right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;display:flex;align-items:center;justify-content:center;z-index:55;box-shadow:0 8px 28px rgba(212,175,55,.4);transition:transform .2s}
.chat-fab:active{transform:scale(.9)}
.chat-panel{position:fixed;bottom:160px;right:18px;width:320px;max-width:calc(100vw - 36px);max-height:440px;background:var(--surface);border:1px solid var(--border);border-radius:20px;z-index:55;display:none;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.4)}
.chat-panel.show{display:flex;animation:scaleIn .25s var(--ease)}
.chat-msgs{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;font-size:13px}
.chat-msg{padding:10px 13px;border-radius:14px;max-width:85%}
.chat-msg.bot{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.me{background:var(--gold);color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.chat-input{padding:11px;border-top:1px solid var(--border);display:flex;gap:9px}
.chat-input input{flex:1;padding:9px 13px;background:var(--surface-2);border-radius:11px;font-size:13px}

/* Maintenance */
.maint{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.maint-card{max-width:420px}
.maint-icon{font-size:68px;margin-bottom:20px}
.maint h2{font-size:26px;margin:0 0 10px;letter-spacing:-.5px;font-family:'Instrument Serif',serif}
.maint p{color:var(--text-2);font-size:14px}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-icon{font-size:56px;opacity:.5;margin-bottom:16px}
.empty p{margin:6px 0;font-size:14px}

/* Tabs (admin etc) */
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text-2);font-weight:600;white-space:nowrap;flex:0 0 auto;transition:all .2s}
.tab.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

/* Product detail */
.pd-img{width:100%;aspect-ratio:1;background:#111 center/cover;border-radius:20px;margin-bottom:16px}
.pd-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:0 0 8px;font-family:'Instrument Serif',serif}
.pd-price{font-size:32px;font-weight:800;color:var(--gold);margin:10px 0;font-family:'Instrument Serif',serif}
.pd-desc{color:var(--text-2);font-size:14px;line-height:1.6;margin:14px 0}
.review-item{padding:14px;background:var(--surface-2);border-radius:14px;margin-bottom:10px;transition:transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.review-item:hover{transform:translateY(-2px)}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.review-name{font-weight:600;font-size:13px}
.review-stars{color:var(--gold);font-size:12px}
.review-text{font-size:13px;color:var(--text-2);line-height:1.5}
.stars-input{display:flex;gap:4px;font-size:24px;cursor:pointer;color:#444;margin-bottom:11px}
.stars-input span.on{color:var(--gold)}
.verified-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:rgba(48,209,88,.12);border-radius:6px;font-size:10px;color:var(--success);font-weight:700;margin-left:6px}
.helpful-btn{font-size:11px;color:var(--text-2);padding:5px 9px;border:1px solid var(--border);border-radius:7px;margin-top:7px;cursor:pointer;transition:all .2s}
.helpful-btn:hover{border-color:var(--gold);color:var(--gold)}

/* VIP */
.vip-card{padding:22px;border-radius:20px;border:1px solid var(--border-2);margin-bottom:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(212,175,55,.06) 0%,rgba(212,175,55,.01) 100%);box-shadow:0 6px 20px rgba(212,175,55,.08)}
.vip-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,175,55,.06),transparent 60%)}
.vip-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.5px}
.vip-bronze{background:rgba(205,127,50,.15);color:#cd7f32;border:1px solid rgba(205,127,50,.3)}
.vip-silver{background:rgba(192,192,192,.15);color:#c0c0c0;border:1px solid rgba(192,192,192,.3)}
.vip-gold{background:rgba(212,175,55,.15);color:var(--gold);border:1px solid var(--border-2)}

/* Support ticket */
.ticket-item{padding:15px;background:var(--surface);border:1px solid var(--border);border-radius:15px;margin-bottom:11px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ticket-item:hover{border-color:var(--border-2);box-shadow:0 4px 12px rgba(212,175,55,.08)}
.ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}

/* FAQ */
.faq-item{padding:15px 17px;background:var(--surface);border:1px solid var(--border);border-radius:15px;margin-bottom:9px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.faq-item:hover{border-color:var(--border-2);box-shadow:0 4px 12px rgba(212,175,55,.08)}
.faq-q{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.faq-a{color:var(--text-2);font-size:13px;line-height:1.6;margin-top:11px;display:none}
.faq-item.open .faq-a{display:block;animation:fadeUp .3s var(--ease)}
.faq-item.open .faq-arrow{transform:rotate(180deg)}
.faq-arrow{transition:transform .3s}

/* Delivery modal */
.delivery-success{text-align:center;padding:22px 0}
.delivery-check{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;background:rgba(48,209,88,.12);border:2px solid var(--success);display:flex;align-items:center;justify-content:center;animation:bounceIn .5s var(--ease);box-shadow:0 8px 24px rgba(48,209,88,.2)}
.delivery-check svg{color:var(--success)}
.delivery-accounts{margin-top:18px;text-align:left}
.delivery-account{padding:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;margin-bottom:9px;font-family:'SF Mono',Menlo,monospace;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.delivery-account span{flex:1;word-break:break-all}

/* Confetti */
.confetti-container{position:fixed;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall 3s linear forwards}

/* Recently purchased popup */
.recent-popup{position:fixed;bottom:100px;left:18px;max-width:300px;padding:13px 15px;background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border-2);border-radius:15px;z-index:55;animation:fadeUp .4s var(--ease);display:flex;align-items:center;gap:11px;font-size:12px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.recent-popup .close-x{position:absolute;top:4px;right:8px;font-size:14px;color:var(--text-2);cursor:pointer}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,rgba(255,255,255,.04) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:skeletonShine 1.5s infinite;border-radius:10px}

.text-c{text-align:center}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.fz12{font-size:12px}.fz14{font-size:14px}
.muted{color:var(--text-2)}
.gold{color:var(--gold)}
.divider{height:1px;background:var(--border);margin:20px 0}
.hidden{display:none!important}

/* Rating bars */
.rating-bars{margin:14px 0}
.rating-bar-row{display:flex;align-items:center;gap:9px;margin-bottom:5px;font-size:12px;color:var(--text-2)}
.rating-bar-track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rating-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .5s}

/* Transaction history */
.tx-item{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tx-icon.credit{background:rgba(48,209,88,.12);color:var(--success)}
.tx-icon.debit{background:rgba(255,69,58,.12);color:var(--danger)}
.tx-amount{font-weight:800;font-size:15px;text-align:right;font-family:'Instrument Serif',serif}
.tx-amount.credit{color:var(--success)}
.tx-amount.debit{color:var(--danger)}

/* ═══════════════════════════════════════════════
   UPGRADE: HOLOGRAPHIC / CYBERPUNK / GLASSMORPHISM
═══════════════════════════════════════════════ */
.holo-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(212,175,55,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,175,55,.06) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);
  animation:holoSlide 22s linear infinite;
}
@keyframes holoSlide{from{background-position:0 0,0 0}to{background-position:48px 48px,48px 48px}}
.holo-scan{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 0,transparent 49.5%,rgba(212,175,55,.06) 50%,transparent 50.5%,transparent 100%);
  background-size:100% 6px;mix-blend-mode:overlay;opacity:.35;
}

.glass-pro{
  background:linear-gradient(140deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid rgba(212,175,55,.18);
  border-radius:18px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.glass-pro::before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(212,175,55,.55),transparent 35%,transparent 65%,rgba(240,215,140,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.5;
}

/* Premium input glow on focus */
.glow-input .input-wrap,.glow-input.input-wrap{transition:border-color .25s,box-shadow .25s,transform .25s}
.glow-input .input-wrap:focus-within,.glow-input.input-wrap:focus-within{
  border-color:var(--gold)!important;
  box-shadow:0 0 0 3px rgba(212,175,55,.18),0 0 24px -4px rgba(212,175,55,.45);
  transform:translateY(-1px);
}
.glow-input textarea,.glow-input input,.glow-input select{caret-color:var(--gold)}

/* Pulse glow border utility */
.glow-pulse{animation:glowPulse 2.4s ease-in-out infinite}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.0),0 8px 28px rgba(212,175,55,.18)}
  50%{box-shadow:0 0 0 6px rgba(212,175,55,.08),0 12px 40px rgba(212,175,55,.35)}
}

/* Gold-accent slide-in toast override */
.toast{
  border:1px solid rgba(212,175,55,.35)!important;
  background:linear-gradient(135deg,rgba(20,20,22,.95),rgba(10,10,12,.95))!important;
  backdrop-filter:blur(18px);box-shadow:0 18px 50px -12px rgba(0,0,0,.7),0 0 0 1px rgba(212,175,55,.12),inset 0 1px 0 rgba(255,255,255,.06);
  animation:toastSlide .42s cubic-bezier(.22,.61,.36,1);
  border-left:3px solid var(--gold)!important;
}
.toast.success{border-left-color:#30d158!important}
.toast.error{border-left-color:#ff453a!important}
@keyframes toastSlide{
  from{transform:translateX(120%) scale(.9);opacity:0}
  to{transform:translateX(0) scale(1);opacity:1}
}

/* === ADMIN PRODUCT MANAGER === */
.apm-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:6px}
@media(max-width:880px){.apm-wrap{grid-template-columns:1fr}}
.apm-panel{padding:18px}
.apm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.apm-title{font-family:'Instrument Serif',serif;font-size:22px;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.apm-sub{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(212,175,55,.8);font-weight:600}
.apm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.apm-grid{grid-template-columns:1fr}}
.apm-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.apm-table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:13px}
.apm-table th{text-align:left;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(212,175,55,.8);padding:0 10px 6px;font-weight:600}
.apm-table td{padding:10px;background:rgba(255,255,255,.025);border-top:1px solid rgba(212,175,55,.1);border-bottom:1px solid rgba(212,175,55,.1)}
.apm-table tr td:first-child{border-left:1px solid rgba(212,175,55,.1);border-radius:12px 0 0 12px}
.apm-table tr td:last-child{border-right:1px solid rgba(212,175,55,.1);border-radius:0 12px 12px 0}
.apm-table tr{transition:transform .15s}
.apm-table tr:hover td{background:rgba(212,175,55,.06)}
.apm-thumb{width:40px;height:40px;border-radius:10px;background-size:cover;background-position:center;border:1px solid rgba(212,175,55,.25);flex-shrink:0}
.apm-row{display:flex;align-items:center;gap:10px}
.apm-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.apm-pill.in{background:rgba(48,209,88,.15);color:#30d158;border:1px solid rgba(48,209,88,.3)}
.apm-pill.out{background:rgba(255,69,58,.15);color:#ff453a;border:1px solid rgba(255,69,58,.3)}
.apm-iconbtn{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.18);color:#fff;cursor:pointer;transition:all .18s}
.apm-iconbtn:hover{background:rgba(212,175,55,.18);border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.apm-iconbtn.danger:hover{background:rgba(255,69,58,.18);border-color:#ff453a;color:#ff453a}
.apm-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid rgba(212,175,55,.18);border-radius:12px;padding:8px 12px;flex:1;min-width:180px}
.apm-search input{background:transparent;border:0;outline:0;color:#fff;flex:1;font-size:13px}

/* Live preview card */
.apm-preview{position:sticky;top:18px}
.apm-preview-card{padding:16px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(212,175,55,.2);position:relative;overflow:hidden}
.apm-preview-img{width:100%;aspect-ratio:16/10;border-radius:12px;background:#1a1a1c center/cover no-repeat;border:1px solid rgba(212,175,55,.15);margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:rgba(212,175,55,.4);font-size:42px;font-family:'Instrument Serif',serif}
.apm-preview-cat{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
.apm-preview-title{font-family:'Instrument Serif',serif;font-size:22px;margin:4px 0 6px;line-height:1.2}
.apm-preview-desc{color:rgba(255,255,255,.6);font-size:13px;line-height:1.5;min-height:38px}
.apm-preview-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid rgba(212,175,55,.12)}
.apm-preview-price{font-family:'Instrument Serif',serif;font-size:26px;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Inventory grid */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.inv-card{padding:14px;position:relative;overflow:hidden}
.inv-card .inv-title{font-weight:700;font-size:14px;margin-bottom:4px;color:#fff}
.inv-card .inv-cat{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.inv-key{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(0,0,0,.35);border:1px dashed rgba(212,175,55,.3);border-radius:10px;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#fff;position:relative}
.inv-key code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;filter:blur(6px);transition:filter .25s}
.inv-key.revealed code{filter:none}
.inv-key .inv-act{display:flex;gap:6px}
.inv-key button{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.3);color:var(--gold);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.inv-key button:hover{background:var(--gold);color:#000}


/* ═══════════════════════════════════════════════
   UPGRADE 2: PREMIUM AUTH GATEWAY
═══════════════════════════════════════════════ */
.gate{
  position:fixed;inset:0;z-index:10;
  display:grid;grid-template-columns:1.05fr .95fr;
  background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,.08),transparent 55%),
             radial-gradient(ellipse at 80% 90%,rgba(240,215,140,.06),transparent 55%),
             #060607;
  overflow:hidden;animation:fadeIn .5s var(--ease);
}
@media(max-width:900px){.gate{grid-template-columns:1fr}.gate-aside{display:none}}
.gate-aside{
  position:relative;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;
  border-right:1px solid rgba(212,175,55,.18);overflow:hidden;
}
.gate-aside::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(212,175,55,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,175,55,.08) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse at 30% 40%,#000,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000,transparent 78%);
  animation:holoSlide 18s linear infinite;pointer-events:none;
}
.gate-aside::after{
  content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.22),transparent 65%);
  filter:blur(40px);top:-120px;left:-80px;animation:floatBlob 14s ease-in-out infinite;pointer-events:none;
}
@keyframes floatBlob{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
.gate-brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.gate-brand .brand-mark{width:42px;height:42px;font-size:20px}
.gate-brand h1{font-family:'Instrument Serif',serif;font-size:22px;margin:0;letter-spacing:.3px}
.gate-brand h1 span{background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-hero{position:relative;z-index:2;max-width:520px}
.gate-tag{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px}
.gate-headline{font-family:'Instrument Serif',serif;font-size:64px;line-height:1.02;letter-spacing:-1.5px;margin:0 0 18px}
.gate-headline em{font-style:italic;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-sub{color:rgba(255,255,255,.65);font-size:16px;line-height:1.6;max-width:440px}
.gate-feats{display:flex;gap:18px;position:relative;z-index:2;flex-wrap:wrap}
.gate-feat{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.75)}
.gate-feat span{width:30px;height:30px;border-radius:8px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);display:grid;place-items:center;color:var(--gold);font-size:14px}

.gate-main{
  position:relative;display:flex;align-items:center;justify-content:center;padding:32px;
  background:linear-gradient(160deg,rgba(255,255,255,.02),rgba(0,0,0,.4));
}
.gate-card{
  width:100%;max-width:430px;padding:34px 30px;border-radius:22px;
  background:linear-gradient(140deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  backdrop-filter:blur(28px) saturate(140%);
  -webkit-backdrop-filter:blur(28px) saturate(140%);
  border:1px solid rgba(212,175,55,.22);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.gate-card::before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(212,175,55,.6),transparent 40%,transparent 60%,rgba(240,215,140,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.gate-title{font-family:'Instrument Serif',serif;font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
.gate-mini{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:22px}
.gate-tabs{display:flex;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.15);border-radius:14px;padding:4px;margin-bottom:22px}
.gate-tab{flex:1;padding:11px;border-radius:11px;font-weight:600;font-size:13px;color:rgba(255,255,255,.6);transition:all .25s;cursor:pointer;letter-spacing:.4px}
.gate-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;box-shadow:0 6px 20px rgba(212,175,55,.35)}
.gate-card .input-wrap{background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.15);border-radius:13px;transition:all .25s}
.gate-card .input-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18),0 0 26px -6px rgba(212,175,55,.5);transform:translateY(-1px)}
.gate-card .input-wrap input{caret-color:var(--gold)}
.gate-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:rgba(255,255,255,.35);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.gate-divider::before,.gate-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.3),transparent)}
.gate-guest{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px;border-radius:13px;cursor:pointer;
  background:transparent;border:1px solid rgba(212,175,55,.3);
  color:var(--gold);font-weight:700;font-size:13.5px;letter-spacing:.4px;
  transition:all .25s;

  _coupon:null,
  applyCoupon(){
    const v = ($("#couponIn")?.value||"").trim().toUpperCase();
    const c = DB.data.coupons.find(x=>x.code===v && x.active);
    if(!c){ this._coupon=null; return Toast.show("Invalid coupon","error"); }
    if(c.maxUses && c.used >= c.maxUses) return Toast.show("Coupon expired","error");
    this._coupon = c;
    Toast.show(c.percent+"% off applied","success");
    this.render();
  },
  checkout(){
    const u = Session.user;
    const c = DB.data.cart[u.id]||[];
    const items = c.map(x=>({...x, p: DB.data.products.find(p=>p.id===x.pid)})).filter(x=>x.p);
    if(!items.length) return Toast.show("Cart empty","error");
    let subtotal = items.reduce((a,x)=>a+x.p.price*x.qty,0);
    let couponDiscount = this._coupon ? subtotal*this._coupon.percent/100 : 0;
    const vipTier = getVipTier(u.totalSpent||0);
    const vipDiscount = vipTier.discount>0 ? (subtotal-couponDiscount)*vipTier.discount/100 : 0;
    let total = subtotal - couponDiscount - vipDiscount;
    if(total < 0) total = 0;
    if(u.balance < total){
      Toast.show("Insufficient balance. Need "+fmt(total-u.balance)+" more.","error");
      return;
    }
    for(const it of items){ if((it.p.stock||[]).length < it.qty) return Toast.show("Not enough stock for "+it.p.title,"error"); }
    u.balance -= total;
    u.totalSpent = (u.totalSpent||0) + total;
    const delivered = [];
    items.forEach(it=>{
      for(let i=0;i<it.qty;i++){
        const acc = it.p.stock.shift();
        delivered.push({ pid:it.p.id, title:it.p.title, account:acc });
      }
      it.p.sold = (it.p.sold||0) + it.qty;
    });
    const order = { id:"o"+Date.now(), userId:u.id, items:delivered, total, status:"delivered", at:Date.now(), coupon:this._coupon?.code||null };
    DB.data.orders.unshift(order);
    DB.data.cart[u.id] = [];
    if(this._coupon){ this._coupon.used = (this._coupon.used||0)+1; }
    this._coupon = null;
    Notify.push(u.id,"Order delivered","Your accounts are ready!","\ud83d\udce6");
    DB.save();
    showConfetti();
    this.showDeliveryModal(delivered, total);
  },

  importData(e){
    const f = e.target.files?.[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const d = JSON.parse(ev.target.result);
        if(!d.users) throw new Error("Invalid backup");
        if(confirm("Replace all data with backup?")){
          DB.data = d; DB.save(); Toast.show("Restored","success"); this.render();
        }
      }catch(err){ Toast.show("Invalid backup file","error"); }
    };
    r.readAsText(f);
  },

  _apmReadImg(e){
    const f = e.target.files?.[0]; if(!f) return;
    if(f.size>2*1024*1024) return Toast.show("Image too large (2MB max)","error");
    const r = new FileReader();
    r.onload = ev=>{
      this._apmDraft.image = ev.target.result;
      const inp = document.getElementById("apm_img"); if(inp) inp.value = ev.target.result;
      const prev = document.getElementById("apmPreview"); if(prev) prev.innerHTML = this._apmPreviewHTML();
      Toast.show("Image loaded","success");
    };
    r.readAsDataURL(f);
  },

  _apmSave(){
    const d = this._apmDraft;
    if(!d.title || !d.title.trim()) return Toast.show("Product title is required","error");
    if(!(d.price>0)) return Toast.show("Price must be greater than 0","error");
    if(this._apmEditId){
      const existing = DB.data.products.find(x=>x.id===this._apmEditId);
      if(existing) Object.assign(existing, d, { id: this._apmEditId });
      Toast.show("Product updated ✓","success");
    } else {
      DB.data.products.push({ ...d });
      Toast.show("Product published ✓","success");
    }
    DB.save();
    this._apmReset();
    this.render();
  },

  _apmEdit(id){
    const p = DB.data.products.find(x=>x.id===id); if(!p) return;
    this._apmDraft = JSON.parse(JSON.stringify(p));
    if(typeof this._apmDraft.outOfStock === "undefined") this._apmDraft.outOfStock = false;
    this._apmEditId = id;
    this.render();
    window.scrollTo({top:0,behavior:"smooth"});
  },

  _apmToggleStock(id){
    const p = DB.data.products.find(x=>x.id===id); if(!p) return;
    p.outOfStock = !p.outOfStock;
    DB.save();
    Toast.show(p.outOfStock?"Marked out of stock":"Product is live again","success");
    this.render();
  },

  _apmDelete(id){
    const p = DB.data.products.find(x=>x.id===id); if(!p) return;
    if(!confirm("Delete \""+p.title+"\"? This cannot be undone.")) return;
    DB.data.products = DB.data.products.filter(x=>x.id!==id);
    DB.save();
    Toast.show("Product removed","success");
    this.render();
  },

  editProduct(id){ if(id) return this._apmEdit(id); this._apmReset(); this.render(); },
  delProduct(id){ return this._apmDelete(id); },
