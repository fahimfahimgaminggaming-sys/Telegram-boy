<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO AI Trading Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color:white;
}

/* HEADER */
.header{
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    background:#111827;
    border-bottom:1px solid #1f2937;
}

/* STATUS */
.status{
    text-align:center;
    padding:10px;
    font-size:14px;
    color:#22c55e;
}

/* GRID */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
    gap:12px;
    padding:15px;
}

/* CARD */
.card{
    background: linear-gradient(145deg, #1e293b, #0f172a);
    padding:15px;
    border-radius:18px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
    border:1px solid #1f2937;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
    border-color:#22c55e;
}

/* TEXT */
.symbol{
    font-size:22px;
    font-weight:bold;
}

.price{
    margin-top:8px;
    color:#93c5fd;
}

.buy{
    color:#22c55e;
    font-weight:bold;
}

.sell{
    color:#ef4444;
    font-weight:bold;
}

.wait{
    color:#facc15;
    font-weight:bold;
}

/* CHART */
.chart{
    margin:15px;
    border-radius:18px;
    overflow:hidden;
}

iframe{
    width:100%;
    height:400px;
    border:none;
}

/* BUTTON */
button{
    width:90%;
    margin:15px auto;
    display:block;
    padding:12px;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    border:none;
    border-radius:12px;
    font-weight:bold;
    color:black;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
🤖 PRO AI CRYPTO DASHBOARD
</div>

<div class="status">
🟢 LIVE MARKET ACTIVE • AUTO UPDATE 10s
</div>

<button onclick="loadData()">🚀 Refresh Signals</button>

<div id="app" class="container"></div>

<div class="chart">
<iframe
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&theme=dark">
</iframe>
</div>

<script>

function getSignal(price){

    if(price < 20000) return "BUY";
    if(price > 60000) return "SELL";

    return "WAIT";
}

async function loadData(){

    document.getElementById("app").innerHTML =
    "<p style='text-align:center'>Loading market data...</p>";

    const res = await fetch("https://api.coincap.io/v2/assets");
    const data = await res.json();

    const coins = data.data.slice(0,6);

    let html = "";

    coins.forEach(c => {

        let price = parseFloat(c.priceUsd);
        let signal = getSignal(price);

        let cls =
        signal === "BUY"
        ? "buy"
        : signal === "SELL"
        ? "sell"
        : "wait";

        html += `
        <div class="card">

            <div class="symbol">💎 ${c.symbol}</div>

            <div class="price">
                $${price.toFixed(2)}
            </div>

            <p class="${cls}">
                📊 Signal: ${signal}
            </p>

            <p style="color:#94a3b8;font-size:12px;">
                Volume: ${parseFloat(c.volumeUsd24Hr).toFixed(0)}
            </p>

        </div>
        `;

    });

    document.getElementById("app").innerHTML = html;
}

loadData();
setInterval(loadData, 10000);

</script>

</body>
</html>
