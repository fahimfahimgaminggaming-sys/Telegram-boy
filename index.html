<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI FUTURES SIGNAL BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#020617;
    color:white;
    overflow-x:hidden;
    transition:.4s;
}

/* THEMES */

body.ios{
    background:#e5e7eb;
    color:#111827;
}

body.ios .card,
body.ios .topbar,
body.ios .signal-box{
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.4);
    color:#111827;
}

body.ios input{
    background:white;
    color:black;
}

body.ios .theme-btn{
    color:black;
}

/* BACKGROUND */

.bg-glow{
    position:fixed;
    width:500px;
    height:500px;
    background:#22c55e33;
    filter:blur(140px);
    top:-200px;
    left:-200px;
    z-index:-1;
}

/* TOPBAR */

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    background:rgba(15,23,42,.8);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #1e293b;
}

.logo{
    font-size:22px;
    font-weight:700;
    color:#22c55e;
}

.right{
    display:flex;
    gap:10px;
    align-items:center;
}

.live{
    background:#16a34a;
    padding:8px 14px;
    border-radius:30px;
    font-size:12px;
    font-weight:bold;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{opacity:1}
    50%{opacity:.5}
    100%{opacity:1}
}

.theme-btn{
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    background:#22c55e;
    color:black;
    font-weight:bold;
}

/* SEARCH */

.search{
    padding:18px;
}

.search input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#0f172a;
    color:white;
    font-size:15px;
    outline:none;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    padding:18px;
}

/* CARD */

.card{
    background:linear-gradient(145deg,#111827,#1e293b);
    border:1px solid #1f2937;
    border-radius:24px;
    padding:20px;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#22c55e;
}

.card::before{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:#22c55e11;
    border-radius:50%;
    top:-50px;
    right:-50px;
}

/* TEXT */

.coin{
    font-size:24px;
    font-weight:700;
}

.price{
    margin-top:10px;
    font-size:30px;
    font-weight:bold;
}

.change-up{
    color:#22c55e;
    margin-top:8px;
}

.change-down{
    color:#ef4444;
    margin-top:8px;
}

/* SIGNAL */

.signal-box{
    margin-top:18px;
    background:#0f172a;
    padding:16px;
    border-radius:18px;
}

.buy{
    color:#22c55e;
    font-weight:bold;
}

.sell{
    color:#ef4444;
    font-weight:bold;
}

.wait{
    color:#facc15;
    font-weight:bold;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

/* AI BAR */

.ai{
    margin-top:16px;
}

.progress{
    height:10px;
    background:#111827;
    border-radius:30px;
    overflow:hidden;
    margin-top:10px;
}

.bar{
    height:100%;
    background:linear-gradient(90deg,#22c55e,#3b82f6);
}

/* FOOTER */

.footer{
    text-align:center;
    padding:30px;
    color:#64748b;
}

/* MOBILE */

@media(max-width:700px){

.logo{
    font-size:18px;
}

.price{
    font-size:24px;
}

}

</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="topbar">

    <div class="logo">
        🤖 AI SIGNAL BOT
    </div>

    <div class="right">

        <div class="live">
            ● LIVE FUTURES
        </div>

        <button class="theme-btn" onclick="toggleTheme()">
            🌓 Theme
        </button>

    </div>

</div>

<div class="search">

    <input
    type="text"
    placeholder="Search BTC, ETH..."
    id="searchInput">

</div>

<div class="grid" id="market"></div>

<div class="footer">
© 2026 AI Futures Signal Bot
</div>

<script>

/* THEME */

function toggleTheme(){

    document.body.classList.toggle("ios");
}

/* SIGNAL ENGINE */

function getSignal(change){

    if(change > 4){

        return {
            signal:"BUY",
            class:"buy",
            confidence:92,
            trend:"Bullish"
        };
    }

    if(change < -3){

        return {
            signal:"SELL",
            class:"sell",
            confidence:87,
            trend:"Bearish"
        };
    }

    return {
        signal:"WAIT",
        class:"wait",
        confidence:60,
        trend:"Neutral"
    };
}

/* LOAD DATA */

async function loadData(){

    const market =
    document.getElementById("market");

    market.innerHTML =
    "<h2>Loading AI Signals...</h2>";

    try{

        const res = await fetch(
        "https://api.coincap.io/v2/assets"
        );

        const data = await res.json();

        const coins =
        data.data.slice(0,12);

        let html = "";

        coins.forEach(c=>{

            const price =
            parseFloat(c.priceUsd);

            const change =
            parseFloat(c.changePercent24Hr);

            const ai =
            getSignal(change);

            const entry =
            price.toFixed(2);

            const tp =
            (price * 1.02).toFixed(2);

            const sl =
            (price * 0.98).toFixed(2);

            html += `

            <div class="card">

                <div class="coin">
                    💎 ${c.symbol}
                </div>

                <div class="price">
                    $${price.toFixed(2)}
                </div>

                <div class="${
                    change >= 0
                    ? 'change-up'
                    : 'change-down'
                }">

                    24H:
                    ${change.toFixed(2)}%

                </div>

                <div class="signal-box">

                    <div class="${ai.class}">
                        📊 ${ai.signal} SIGNAL
                    </div>

                    <div class="row">
                        <span>Entry</span>
                        <span>$${entry}</span>
                    </div>

                    <div class="row">
                        <span>Take Profit</span>
                        <span class="buy">
                            $${tp}
                        </span>
                    </div>

                    <div class="row">
                        <span>Stop Loss</span>
                        <span class="sell">
                            $${sl}
                        </span>
                    </div>

                    <div class="row">
                        <span>Trend</span>
                        <span>${ai.trend}</span>
                    </div>

                    <div class="row">
                        <span>Timeframe</span>
                        <span>15M</span>
                    </div>

                </div>

                <div class="ai">

                    🤖 AI Confidence:
                    ${ai.confidence}%

                    <div class="progress">

                        <div
                        class="bar"
                        style="
                        width:${ai.confidence}%
                        ">
                        </div>

                    </div>

                </div>

            </div>

            `;
        });

        market.innerHTML = html;

    }catch(err){

        market.innerHTML =
        "<h2>❌ API Error</h2>";
    }
}

loadData();

setInterval(loadData,10000);

/* SEARCH */

document
.getElementById("searchInput")
.addEventListener("keyup",function(){

    let value =
    this.value.toLowerCase();

    let cards =
    document.querySelectorAll(".card");

    cards.forEach(card=>{

        let coin =
        card.innerText.toLowerCase();

        card.style.display =
        coin.includes(value)
        ? "block"
        : "none";

    });

});

/* NOTIFICATION */

if(Notification.permission !== "granted"){
    Notification.requestPermission();
}

function sendSignalAlert(){

    if(Notification.permission === "granted"){

        new Notification(
        "🚀 AI SIGNAL ALERT",
        {
            body:"BTCUSDT Strong BUY Signal Detected"
        });
    }
}

setTimeout(sendSignalAlert,12000);

</script>

</body>
</html>
