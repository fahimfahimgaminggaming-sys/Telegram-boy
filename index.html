<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>🎂 Premium Birthday Wish</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
    overflow:hidden;
    font-family: Arial, sans-serif;
}

/* Animated Background */
.bg-animated{
    background: linear-gradient(-45deg,#ff9ecf,#ffc4dd,#fbc2eb,#a18cd1);
    background-size:400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* Glassmorphism */
.glass{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
}

/* Floating */
.float{
    animation: float 4s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0px)}
    50%{transform:translateY(-12px)}
    100%{transform:translateY(0px)}
}

/* Glow */
.glow{
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:0 0 20px #ff7eb3;
    }
    to{
        box-shadow:0 0 45px #ff1493;
    }
}

/* Balloons */
.balloon{
    position:absolute;
    font-size:40px;
    animation: rise linear infinite;
}

@keyframes rise{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-120vh);
        opacity:1;
    }
}

/* Firework Canvas */
canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body class="bg-animated min-h-screen flex items-center justify-center relative p-4">

<!-- Firework Canvas -->
<canvas id="fireworkCanvas"></canvas>

<!-- Balloons -->
<div class="balloon left-[10%]" style="animation-duration:12s;">🎈</div>
<div class="balloon left-[30%]" style="animation-duration:15s;">🎈</div>
<div class="balloon left-[60%]" style="animation-duration:10s;">🎈</div>
<div class="balloon left-[85%]" style="animation-duration:14s;">🎈</div>

<!-- Card -->
<div class="glass glow rounded-[35px] p-8 w-full max-w-md text-center text-white z-10">

    <!-- Upload Photo -->
    <label class="cursor-pointer">
        <img id="preview"
        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
        class="w-32 h-32 rounded-full mx-auto border-4 border-white object-cover mb-4 shadow-xl"/>

        <input type="file"
        id="photoUpload"
        accept="image/*"
        class="hidden">
    </label>

    <div class="text-6xl mb-4 float">
        🎂
    </div>

    <!-- Name Input -->
    <input
    type="text"
    id="nameInput"
    placeholder="তোমার নাম লিখো..."
    class="w-full p-3 rounded-xl text-black mb-4 outline-none text-center"/>

    <h1 id="birthdayTitle"
    class="text-3xl font-extrabold mb-3">
        🎉 শুভ জন্মদিন! 🎉
    </h1>

    <p class="text-lg opacity-90 mb-5">
        তোমার জীবন ভরে উঠুক সুখ, ভালোবাসা আর সফলতায় ❤️
    </p>

    <!-- Music -->
    <audio id="birthdayMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <button onclick="startCelebration()"
    class="bg-gradient-to-r from-pink-500 to-purple-500 px-8 py-4 rounded-full font-bold hover:scale-110 transition duration-300 shadow-2xl">
        🎁 Celebration শুরু করো
    </button>

    <p id="wishMessage"
    class="hidden mt-5 text-xl font-bold animate-bounce">
        🎉 অনেক শুভেচ্ছা ও ভালোবাসা! 🎂
    </p>
</div>

<script>
/* Photo Upload */
document.getElementById('photoUpload')
.addEventListener('change', function(e){
    const file = e.target.files[0];
    if(file){
        document.getElementById('preview').src =
        URL.createObjectURL(file);
    }
});

/* Name Customize */
document.getElementById('nameInput')
.addEventListener('input', function(){
    const name = this.value.trim();
    const title = document.getElementById('birthdayTitle');

    if(name){
        title.innerHTML =
        `🎉 শুভ জন্মদিন, ${name}! 🎉`;
    }else{
        title.innerHTML =
        `🎉 শুভ জন্মদিন! 🎉`;
    }
});

/* Celebration */
function startCelebration(){

    // Music
    document.getElementById('birthdayMusic').play();

    // Confetti
    confetti({
        particleCount:300,
        spread:180,
        origin:{y:0.6}
    });

    setInterval(()=>{
        confetti({
            particleCount:80,
            spread:100
        });
    },2500);

    // Message
    document.getElementById('wishMessage')
    .classList.remove('hidden');

    // Fireworks
    fireworkBurst();
}

/* Fireworks */
const canvas =
document.getElementById("fireworkCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function fireworkBurst(){
    setInterval(()=>{
        confetti({
            particleCount:120,
            spread:360,
            startVelocity:45,
            origin:{
                x:Math.random(),
                y:Math.random()*0.5
            }
        });
    },900);
}

window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});
</script>

</body>
</html>
