<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="TrustBuy - Premium digital marketplace with instant delivery" />
<title>TrustBuy.com — Premium Digital Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='Inter,sans-serif' font-size='32' font-weight='800' fill='%23d4af37' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#000;
  --bg-2:#0a0a0a;
  --surface:rgba(20,20,22,.72);
  --surface-2:rgba(28,28,32,.78);
  --border:rgba(255,255,255,.08);
  --border-2:rgba(212,175,55,.22);
  --text:#f5f5f7;
  --text-2:#a1a1a6;
  --muted:#6e6e73;
  --gold:#d4af37;
  --gold-2:#f0d78c;
  --gold-soft:rgba(212,175,55,.12);
  --danger:#ff453a;
  --success:#30d158;
  --info:#0a84ff;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body{background:radial-gradient(1200px 800px at 80% -10%,rgba(212,175,55,.08),transparent 60%),radial-gradient(900px 600px at -10% 100%,rgba(212,175,55,.05),transparent 60%),#000;padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:transparent;border:none;outline:none;width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* Loading */
#loader{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s var(--ease)}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{font-size:42px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px;animation:pulse 1.6s ease-in-out infinite}
.loader-ring{width:42px;height:42px;border:2px solid rgba(212,175,55,.18);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes goldGlow{0%,100%{box-shadow:0 0 20px rgba(212,175,55,.2)}50%{box-shadow:0 0 40px rgba(212,175,55,.4),0 0 80px rgba(212,175,55,.15)}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes skeletonShine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes checkmark{0%{stroke-dashoffset:50}100%{stroke-dashoffset:0}}

/* Glass */
.glass{background:var(--surface);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius)}
.glass-gold{background:var(--surface);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border-2);border-radius:var(--radius);animation:goldGlow 3s ease-in-out infinite}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(0,0,0,.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1c1c1e,#000);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;border:1px solid var(--border-2);box-shadow:0 4px 20px rgba(212,175,55,.15)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);transition:transform .2s var(--ease),background .2s}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #000}
.icon-wrap{position:relative}

/* Main */
.app{padding:18px 18px 110px;max-width:1100px;margin:0 auto;animation:fadeIn .4s var(--ease)}
.page{animation:fadeUp .35s var(--ease)}

/* Hero / banner slider */
.hero{
border-radius:22px;
overflow:hidden;
position:relative;
margin-bottom:22px;
min-height:420px;
background:#000;
border:1px solid var(--border-2);
isolation:isolate;
}

.hero-video{
position:absolute;
top:50%;
left:50%;
width:120%;
height:120%;
object-fit:cover;
transform:translate(-50%,-50%);
z-index:0;
opacity:.45;
will-change:transform,opacity;
backface-visibility:hidden;
}

.hero-overlay{
position:absolute;
inset:0;
background:
radial-gradient(circle at top,
rgba(212,175,55,.15),
transparent 50%),
linear-gradient(
180deg,
rgba(0,0,0,.1),
rgba(0,0,0,.65)
);
z-index:1;
}

.gold-particles{
position:absolute;
inset:0;
pointer-events:none;
z-index:2;
overflow:hidden;
}

.particle{
position:absolute;
border-radius:50%;
background:radial-gradient(
circle,
rgba(240,215,140,.9),
rgba(212,175,55,.4),
transparent
);
animation:floatGold linear infinite;
filter:blur(.4px);
}

@keyframes floatGold{
0%{
transform:
translateY(100vh)
translateX(0)
scale(.5);
opacity:0;
}
15%{opacity:1}
100%{
transform:
translateY(-120vh)
translateX(80px)
scale(1.2);
opacity:0;
}
}

.hero-content{
position:relative;
z-index:5;
}
.hero-slides{display:flex;transition:transform .6s var(--ease);height:100%}
.hero-slide{min-width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;position:relative;background-size:cover;background-position:center}
.hero-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85))}
.hero-slide>*{position:relative;z-index:1}
.hero-tag{display:inline-block;padding:6px 12px;background:rgba(212,175,55,.18);border:1px solid var(--border-2);border-radius:999px;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;width:fit-content}
.hero-title{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-.5px;margin:0 0 6px;max-width:80%}
.hero-sub{color:var(--text-2);font-size:14px;margin:0;max-width:80%}
.hero-dots{position:absolute;bottom:14px;right:18px;display:flex;gap:6px;z-index:2}
.hero-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:all .3s}
.hero-dot.active{width:22px;background:var(--gold)}

/* Flash sale */
.flash{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:18px;border-radius:16px;background:linear-gradient(135deg,rgba(255,69,58,.15),rgba(212,175,55,.08));border:1px solid rgba(255,69,58,.25)}
.flash-left{display:flex;align-items:center;gap:10px}
.flash-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,69,58,.2);font-size:18px}
.flash-title{font-weight:700;font-size:14px}
.flash-sub{font-size:12px;color:var(--text-2)}
.flash-timer{display:flex;gap:4px}
.flash-cell{background:#000;border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:34px;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 14px}
.section-title{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0}
.section-link{font-size:13px;color:var(--gold);font-weight:500}

/* Search */
.search-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:18px;transition:border-color .2s}
.search-bar:focus-within{border-color:var(--gold)}
.search-bar svg{flex:0 0 18px;color:var(--text-2)}
.search-bar input{flex:1;font-size:15px}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .2s var(--ease);white-space:nowrap}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.chip:active{transform:scale(.95)}

/* Sort */
.sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--text-2)}
.sort-select{padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;width:auto;cursor:pointer}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--border-2);box-shadow:0 8px 30px rgba(212,175,55,.1)}
.card-img{aspect-ratio:1;background:#111 center/cover no-repeat;position:relative;overflow:hidden}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.4))}
.card-fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .2s}
.card-fav.active{color:var(--danger)}
.card-fav:active{transform:scale(.85)}
.card-stock{position:absolute;top:8px;left:8px;padding:4px 8px;background:rgba(48,209,88,.2);border:1px solid rgba(48,209,88,.4);border-radius:8px;font-size:10px;font-weight:600;color:var(--success);z-index:2}
.card-stock.out{background:rgba(255,69,58,.2);border-color:rgba(255,69,58,.4);color:var(--danger)}
.card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-size:14px;font-weight:600;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.card-rating{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2)}
.card-rating .star{color:var(--gold)}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.card-price{font-size:16px;font-weight:700;color:var(--gold)}
.card-price small{font-size:11px;color:var(--muted);font-weight:400;text-decoration:line-through;margin-left:4px}
.add-btn{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;transition:transform .15s}
.add-btn:active{transform:scale(.85)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(10,10,10,.85);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--border)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--text-2);font-size:10px;font-weight:500;border-radius:12px;transition:color .2s;position:relative}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px}
.nav-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--gold);border-radius:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .15s var(--ease),opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;box-shadow:0 6px 24px rgba(212,175,55,.3)}
.btn-secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:rgba(255,69,58,.15);border:1px solid rgba(255,69,58,.35);color:var(--danger)}
.btn-success{background:rgba(48,209,88,.15);border:1px solid rgba(48,209,88,.35);color:var(--success)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn:disabled{opacity:.5;pointer-events:none}

/* Auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .5s var(--ease)}
.auth-card{width:100%;max-width:420px;padding:32px 26px;border-radius:24px}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .brand-mark{margin:0 auto 14px;width:54px;height:54px;font-size:24px;border-radius:14px}
.auth-logo h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
.auth-logo p{color:var(--text-2);font-size:14px;margin:0}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-2);transition:all .25s}
.auth-tab.active{background:var(--gold);color:#000}
.field{margin-bottom:14px}
.field-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500;padding-left:4px}
.input-wrap{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:border-color .2s}
.input-wrap:focus-within{border-color:var(--gold)}
.input-wrap svg{flex:0 0 18px;color:var(--text-2)}
.eye-btn{flex:0 0 auto;color:var(--text-2);padding:2px}
.pwd-strength{height:4px;border-radius:2px;margin-top:6px;background:var(--surface-2);overflow:hidden}
.pwd-strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--text-2)}
.remember-row input{width:auto}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s var(--ease)}
@media(min-width:640px){.modal-backdrop{align-items:center}}
.modal{width:100%;max-width:520px;max-height:90vh;background:#0e0e10;border:1px solid var(--border);border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .35s var(--ease)}
@media(min-width:640px){.modal{border-radius:24px;animation:scaleIn .25s var(--ease)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700;margin:0}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.close-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2)}

/* Toast */
#toast-host{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{padding:13px 16px;border-radius:14px;background:rgba(20,20,22,.95);backdrop-filter:blur(20px);border:1px solid var(--border);font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fadeUp .3s var(--ease);display:flex;align-items:center;gap:10px}
.toast.success{border-color:rgba(48,209,88,.4);color:var(--success)}
.toast.error{border-color:rgba(255,69,58,.4);color:var(--danger)}
.toast.info{border-color:var(--border-2);color:var(--gold)}

/* Wallet */
.wallet-card{padding:24px;border-radius:22px;background:linear-gradient(135deg,#1a1a1f 0%,#0a0a0a 100%);border:1px solid var(--border-2);position:relative;overflow:hidden;margin-bottom:18px}
.wallet-card::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%);top:-80px;right:-60px}
.wallet-label{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px;position:relative}
.wallet-bal{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px;position:relative;margin-bottom:14px}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}

/* Crypto methods */
.crypto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.crypto-item{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);text-align:center;transition:all .2s var(--ease)}
.crypto-item:hover{border-color:var(--border-2);transform:translateY(-2px)}
.crypto-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;color:#fff}
.crypto-name{font-weight:700;font-size:13px}
.crypto-net{font-size:11px;color:var(--text-2);margin-top:2px}

/* Deposit page */
.deposit-warn{padding:12px 14px;border-radius:12px;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.3);color:#ff9f0a;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.qr-box{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:18px;margin:14px auto;width:fit-content}
.addr-box{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;word-break:break-all;font-family:'SF Mono',Menlo,monospace;font-size:12px}
.copy-btn{flex:0 0 auto;padding:8px 12px;background:var(--gold);color:#000;border-radius:8px;font-weight:600;font-size:12px}
.upload-zone{padding:24px;border:2px dashed var(--border);border-radius:14px;text-align:center;color:var(--text-2);font-size:13px;cursor:pointer;transition:border-color .2s;margin-bottom:12px}
.upload-zone:hover{border-color:var(--gold);color:var(--gold)}
.upload-zone img{margin:10px auto 0;max-width:200px;max-height:200px;border-radius:10px}

/* Deposit status pipeline */
.deposit-pipeline{display:flex;align-items:center;justify-content:center;gap:0;margin:18px 0}
.pipeline-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}

/* ---------- DB ---------- */
const DB = {
  data: null,

    t.innerHTML = `<span>${icons[type]||"\u2605"}</span> ${msg}`;

    setTimeout(()=>{ t.style.opacity="0"; t.style.transform="translateY(-8px)"; setTimeout(()=>t.remove(),300); }, ms);

};

    if(!name||!email||!pass) return { ok:false, msg:"All fields required" };
    if(pass.length<6) return { ok:false, msg:"Password must be 6+ chars" };
    if(!/^\S+@\S+\.\S+$/.test(email)) return { ok:false, msg:"Invalid email" };
    if(DB.data.users.find(x=>x.email.toLowerCase()===email.toLowerCase())) return { ok:false, msg:"Email already registered" };
    const u = { id:"u"+Date.now(), name, email, pass, balance:0, role:email.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"admin":"user", banned:false, createdAt:Date.now(), refCode:"REF"+Math.random().toString(36).slice(2,8).toUpperCase(), totalSpent:0 };
    DB.data.users.push(u);
    if(refCode){
      const refUser = DB.data.users.find(x=>x.refCode===refCode);
      if(refUser){
        refUser.balance += DB.data.settings.referralBonus||1;
        DB.data.referrals[refUser.id] = (DB.data.referrals[refUser.id]||0)+1;
        Notify.push(refUser.id,"Referral bonus","+$"+(DB.data.settings.referralBonus||1)+" credited.","\ud83c\udf81");
      }
    }
    DB.save();
    this.user = u;
    localStorage.setItem(SESSION_KEY, u.id);
    return { ok:true };
  },
  logout(){ this.user=null; localStorage.removeItem(SESSION_KEY); App.render(); }
};

/* ---------- Confetti ---------- */
function showConfetti(){
  const c = document.createElement("div");
  c.className="confetti-container";
  const colors = ["#d4af37","#f0d78c","#30d158","#0a84ff","#ff453a","#fff"];
  for(let i=0;i<60;i++){
    const p = document.createElement("div");
    p.className="confetti-piece";
    p.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?"50%":"2px"};animation-delay:${Math.random()*1.5}s;animation-duration:${2+Math.random()*2}s`;
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),4000);
}

  /* ---------- CART ---------- */
  addToCart(pid){
    const u = Session.user;
    const p = DB.data.products.find(x=>x.id===pid);
    if(!p) return;
    if(!(p.stock||[]).length) return Toast.show("Out of stock","error");
    DB.data.cart[u.id] ||= [];
    const c = DB.data.cart[u.id];
    const ex = c.find(x=>x.pid===pid);
    if(ex){
      if(ex.qty >= (p.stock||[]).length) return Toast.show("Max stock reached","error");
      ex.qty++;
    } else c.push({ pid, qty:1 });
    DB.save();
    Toast.show("Added to cart","success");
    this.render();
  },

  _coupon:null,
  applyCoupon(){
    const v = ($("#couponIn")?.value||"").trim().toUpperCase();
    const c = DB.data.coupons.find(x=>x.code===v && x.active);
    if(!c){ this._coupon=null; return Toast.show("Invalid coupon","error"); }
    if(c.maxUses && c.used >= c.maxUses) return Toast.show("Coupon expired","error");
    this._coupon = c;
    Toast.show(c.percent+"% off applied","success");
    this.render();
  },
  checkout(){
    const u = Session.user;
    const c = DB.data.cart[u.id]||[];
    const items = c.map(x=>({...x, p: DB.data.products.find(p=>p.id===x.pid)})).filter(x=>x.p);
    if(!items.length) return Toast.show("Cart empty","error");
    let subtotal = items.reduce((a,x)=>a+x.p.price*x.qty,0);
    let couponDiscount = this._coupon ? subtotal*this._coupon.percent/100 : 0;
    const vipTier = getVipTier(u.totalSpent||0);
    const vipDiscount = vipTier.discount>0 ? (subtotal-couponDiscount)*vipTier.discount/100 : 0;
    let total = subtotal - couponDiscount - vipDiscount;
    if(total < 0) total = 0;
    if(u.balance < total){
      Toast.show("Insufficient balance. Need "+fmt(total-u.balance)+" more.","error");
      return;
    }
    for(const it of items){ if((it.p.stock||[]).length < it.qty) return Toast.show("Not enough stock for "+it.p.title,"error"); }
    u.balance -= total;
    u.totalSpent = (u.totalSpent||0) + total;
    const delivered = [];
    items.forEach(it=>{
      for(let i=0;i<it.qty;i++){
        const acc = it.p.stock.shift();
        delivered.push({ pid:it.p.id, title:it.p.title, account:acc });
      }
      it.p.sold = (it.p.sold||0) + it.qty;
    });
    const order = { id:"o"+Date.now(), userId:u.id, items:delivered, total, status:"delivered", at:Date.now(), coupon:this._coupon?.code||null };
    DB.data.orders.unshift(order);
    DB.data.cart[u.id] = [];
    if(this._coupon){ this._coupon.used = (this._coupon.used||0)+1; }
    this._coupon = null;
    Notify.push(u.id,"Order delivered","Your accounts are ready!","\ud83d\udce6");
    DB.save();
    showConfetti();
    this.showDeliveryModal(delivered, total);
  },
  showDeliveryModal(delivered, total){
    this.openModal("Order Delivered!", '<div class="delivery-success">'+
      '<div class="delivery-check"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg></div>'+

  importData(e){

    const r = new FileReader();
    r.onload = ev=>{
      try{

        if(!d.users) throw new Error("Invalid backup");

          DB.data = d; DB.save(); Toast.show("Restored","success"); this.render();
        }
      }catch(err){ Toast.show("Invalid backup file","error"); }
    };
    r.readAsText(f);

    this.openModal("Product", `
      <div class="field"><label class="field-label">Title</label><div class="input-wrap"><input id="pf_title" value="${esc(p.title)}" /></div></div>
      <div class="field"><label class="field-label">Category</label><div class="input-wrap"><input id="pf_cat" value="${esc(p.category)}" /></div></div>
      <div class="row">
        <div class="field"><label class="field-label">Price</label><div class="input-wrap"><input id="pf_price" type="number" step="0.01" value="${p.price}" /></div></div>
        <div class="field"><label class="field-label">Old price</label><div class="input-wrap"><input id="pf_old" type="number" step="0.01" value="${p.oldPrice||0}" /></div></div>
      </div>
      <div class="field"><label class="field-label">Image URL or upload</label>
        <div class="input-wrap"><input id="pf_img" value="${esc(p.image)}" placeholder="https://..." /></div>
        <input type="file" id="pf_imgfile" accept="image/*" style="margin-top:8px;font-size:12px" onchange="App._readImg(event,'pf_img')" /></div>
      <div class="field"><label class="field-label">Description</label><div class="input-wrap"><textarea id="pf_desc" rows="3" style="resize:vertical">${esc(p.desc||"")}</textarea></div></div>
      <div class="field"><label class="field-label">Stock (one account per line, format email:pass)</label><div class="input-wrap"><textarea id="pf_stock" rows="4" style="resize:vertical;font-family:monospace;font-size:13px">${esc((p.stock||[]).join("\n"))}</textarea></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="pf_feat" ${p.featured?"checked":""} style="width:auto" /> Featured</label>
    `, ()=>{
      p.title = ($("#pf_title")?.value||"").trim();
      p.category = ($("#pf_cat")?.value||"").trim()||"General";
      p.price = parseFloat($("#pf_price")?.value)||0;
      p.oldPrice = parseFloat($("#pf_old")?.value)||0;
      p.image = ($("#pf_img")?.value||"").trim();
      p.desc = ($("#pf_desc")?.value||"").trim();
      p.stock = ($("#pf_stock")?.value||"").split("\n").map(s=>s.trim()).filter(Boolean);
      p.featured = $("#pf_feat")?.checked||false;
      if(!p.title) return Toast.show("Title required","error");
      if(!id) DB.data.products.push(p);
      DB.save(); Toast.show("Saved","success"); this.closeModal(); this.render();
    });
  },
  _readImg(e, targetId){
    const f = e.target.files?.[0]; if(!f) return;
    if(f.size>2*1024*1024) return Toast.show("Image too large (2MB max)","error");
    const r = new FileReader();
    r.onload = ev=>{ document.getElementById(targetId).value = ev.target.result; Toast.show("Image loaded","success"); };
    r.readAsDataURL(f);
  },
  delProduct(id){
    if(!confirm("Delete this product?")) return;
    DB.data.products = DB.data.products.filter(x=>x.id!==id);
    DB.save(); this.render();
  },
  adminOrders(){
    const o = DB.data.orders;
    return o.length?o.map(or=>{
      const u = DB.data.users.find(x=>x.id===or.userId);
      return '<div class="glass mb-8" style="padding:12px">'+
        '<div style="display:flex;justify-content:space-between"><div><b>#'+or.id.slice(-6)+'</b><div class="muted fz12">'+esc(u?.email||"?")+' \u00b7 '+fmtTime(or.at)+'</div></div><div class="gold" style="font-weight:700">'+fmt(or.total)+'</div></div>'+
        '<div class="fz12 muted mt-8">'+or.items.length+' item(s) \u00b7 '+esc(or.status)+'</div></div>';
    }).join(""):'<p class="muted">No orders</p>';
  },
  adminDeps(){
    const deps = DB.data.deposits;
    return deps.length?deps.map(d=>{
      const u = DB.data.users.find(x=>x.id===d.userId);
      return '<div class="glass mb-8" style="padding:12px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div><b>'+fmt(d.amount)+'</b> via '+esc(d.method)+'<div class="muted fz12">'+esc(u?.email||"?")+' \u00b7 '+fmtTime(d.at)+'</div></div>'+
        '<span class="status-pill status-'+d.status+'">'+d.status+'</span></div>'+
        (d.txid?'<div class="fz12 muted mt-8">TXID: '+esc(d.txid)+'</div>':'')+
        (d.proof?'<img src="'+d.proof+'" style="max-width:100px;border-radius:6px;margin-top:8px" onclick="window.open(\''+d.proof+'\',\'_blank\')" />':'')+
        (d.status==="pending"?'<div class="row mt-8"><button class="btn btn-success" onclick="App.approveDep(\''+d.id+'\')">Approve</button><button class="btn btn-danger" onclick="App.rejectDep(\''+d.id+'\')">Reject</button></div>':'')+'</div>';
    }).join(""):'<p class="muted">No deposits</p>';
  },
  approveDep(id){
    const d = DB.data.deposits.find(x=>x.id===id); if(!d||d.status!=="pending") return;
    const u = DB.data.users.find(x=>x.id===d.userId);
    if(u){ u.balance += d.amount; Notify.push(u.id,"Deposit approved","+"+fmt(d.amount)+" added to wallet.","\u2705"); }
    d.status="approved"; DB.save(); Toast.show("Approved","success"); this.render();
  },
  rejectDep(id){
    const d = DB.data.deposits.find(x=>x.id===id); if(!d) return;
    d.status="rejected"; Notify.push(d.userId,"Deposit rejected","Contact support if needed.","\u274c");
    DB.save(); Toast.show("Rejected"); this.render();
  },
  adminUsers(){
    const q = this._adminSearch.toLowerCase();
    let users = DB.data.users;
    if(q) users = users.filter(u=>u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));
    return '<div class="search-bar mb-12"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'+
      '<input placeholder="Search users..." value="'+esc(this._adminSearch)+'" oninput="App._adminSearch=this.value;App.render()" /></div>'+
      users.map(u=>
        '<div class="list-item"><div class="avatar" style="width:44px;height:44px;font-size:16px;flex:0 0 44px">'+esc((u.name||"U")[0].toUpperCase())+'</div>'+
        '<div class="list-body"><p class="list-title">'+esc(u.name)+(u.role==="admin"?' <span class="gold">\u2605</span>':'')+'</p><p class="list-sub">'+esc(u.email)+' \u00b7 '+fmt(u.balance)+'</p></div>'+
        '<div class="row" style="flex:0 0 auto;gap:6px">'+
          (u.role!=="admin"?
            '<button class="add-btn" style="background:rgba(212,175,55,.2);color:var(--gold);font-size:10px;width:auto;padding:0 8px" onclick="App.adjustBalance(\''+u.id+'\')">$</button>'+
            '<button class="add-btn" style="background:'+(u.banned?"rgba(48,209,88,.2);color:var(--success)":"rgba(255,69,58,.2);color:var(--danger)")+';font-size:12px;width:auto;padding:0 10px" onclick="App.toggleBan(\''+u.id+'\')">'+(u.banned?"Unban":"Ban")+'</button>'
          :'')+
        '</div></div>').join("");
  },
  toggleBan(id){
    const u = DB.data.users.find(x=>x.id===id); if(!u) return;
    u.banned = !u.banned; DB.save(); Toast.show(u.banned?"Banned":"Unbanned","success"); this.render();
  },
  adjustBalance(id){
    const u = DB.data.users.find(x=>x.id===id); if(!u) return;
    this.openModal("Adjust Balance - "+u.name,
      '<p class="muted fz14">Current: '+fmt(u.balance)+'</p>'+
      '<div class="field"><label class="field-label">Amount (+/-)</label><div class="input-wrap"><input id="balAdj" type="number" step="0.01" placeholder="e.g. 10 or -5" /></div></div>',
      ()=>{
        const amt = parseFloat($("#balAdj")?.value);
        if(isNaN(amt)) return Toast.show("Invalid amount","error");
        u.balance += amt;
        if(u.balance<0) u.balance=0;
        Notify.push(u.id,"Balance updated","Admin adjusted your balance by "+fmt(amt),"\ud83d\udcb0");
        DB.save(); Toast.show("Balance updated to "+fmt(u.balance),"success"); this.closeModal(); this.render();
      });
  },
  adminCoupons(){
    return '<button class="btn btn-primary mb-12" onclick="App.addCoupon()">+ New coupon</button>'+
      DB.data.coupons.map((c,i)=>
        '<div class="list-item"><div class="list-body"><p class="list-title gold">'+esc(c.code)+'</p>'+
        '<p class="list-sub">'+c.percent+'% off \u00b7 '+(c.active?"Active":"Inactive")+' \u00b7 '+(c.used||0)+'/'+(c.maxUses||"\u221e")+' used</p></div>'+
        '<button class="add-btn" style="background:rgba(255,69,58,.2);color:var(--danger)" onclick="DB.data.coupons.splice('+i+',1);DB.save();App.render()">\ud83d\uddd1</button></div>').join("");
  },
  addCoupon(){
    this.openModal("New Coupon",
      '<div class="field"><label class="field-label">Code</label><div class="input-wrap"><input id="cpCode" placeholder="SAVE20" /></div></div>'+
      '<div class="field"><label class="field-label">Percent off (1-90)</label><div class="input-wrap"><input id="cpPct" type="number" min="1" max="90" /></div></div>'+
      '<div class="field"><label class="field-label">Max uses (0=unlimited)</label><div class="input-wrap"><input id="cpMax" type="number" value="100" /></div></div>',
      ()=>{
        const code = ($("#cpCode")?.value||"").trim().toUpperCase();
        const pct = parseInt($("#cpPct")?.value,10);
        const max = parseInt($("#cpMax")?.value,10)||0;
        if(!code) return Toast.show("Enter code","error");
        if(!pct||pct<1||pct>90) return Toast.show("Invalid percent","error");
        DB.data.coupons.push({ code, percent:pct, active:true, maxUses:max, used:0 });
        DB.save(); Toast.show("Coupon created","success"); this.closeModal(); this.render();
      });
  },
  adminBanners(){
    return '<button class="btn btn-primary mb-12" onclick="App.editBanner()">+ New banner</button>'+
      DB.data.banners.map((b,i)=>
        '<div class="list-item"><div class="list-img" style="background-image:url(\''+esc(b.img)+'\')"></div>'+
        '<div class="list-body"><p class="list-title">'+esc(b.title)+'</p><p class="list-sub">'+esc(b.tag)+'</p></div>'+
        '<button class="add-btn" style="background:rgba(255,69,58,.2);color:var(--danger)" onclick="DB.data.banners.splice('+i+',1);DB.save();App.render()">\ud83d\uddd1</button></div>').join("");
  },
  editBanner(){
    this.openModal("New Banner",
      '<div class="field"><label class="field-label">Tag</label><div class="input-wrap"><input id="bnTag" value="Featured" /></div></div>'+
      '<div class="field"><label class="field-label">Title</label><div class="input-wrap"><input id="bnTitle" /></div></div>'+
      '<div class="field"><label class="field-label">Subtitle</label><div class="input-wrap"><input id="bnSub" /></div></div>'+
      '<div class="field"><label class="field-label">Image URL</label><div class="input-wrap"><input id="bnImg" placeholder="https://..." /></div></div>',
      ()=>{
        const tag = ($("#bnTag")?.value||"").trim()||"Featured";
        const title = ($("#bnTitle")?.value||"").trim();
        if(!title) return Toast.show("Title required","error");
        DB.data.banners.push({ tag, title, sub:($("#bnSub")?.value||"").trim(), img:($("#bnImg")?.value||"").trim() });
        DB.save(); Toast.show("Banner added","success"); this.closeModal(); this.render();
      });
  },
  adminTickets(){
    const tickets = DB.data.tickets;
    return tickets.length?tickets.map(t=>{
      const u = DB.data.users.find(x=>x.id===t.userId);
      return '<div class="ticket-item" onclick="App.adminViewTicket(\''+t.id+'\')">'+
        '<div class="ticket-head"><span style="font-weight:600">'+esc(t.subject)+'</span>'+
        '<span class="status-pill status-'+(t.status==="open"?"pending":"completed")+'">'+t.status+'</span></div>'+
        '<div class="fz12 muted">'+esc(u?.email||"?")+' \u00b7 '+fmtTime(t.at)+' \u00b7 '+t.messages.length+' msgs</div></div>';
    }).join(""):'<p class="muted">No tickets</p>';
  },
  adminViewTicket(id){
    const t = DB.data.tickets.find(x=>x.id===id);
    if(!t) return;
    this.openModal("Ticket: "+t.subject,
      t.messages.map(m=>'<div class="chat-msg '+(m.from==="user"?"me":"bot")+'">'+esc(m.text)+'<div class="fz12 muted" style="margin-top:4px">'+fmtTime(m.at)+'</div></div>').join("")+
      '<div class="mt-12"><div class="input-wrap"><input id="adminReply" placeholder="Admin reply..." /></div></div>'+
      '<div class="row mt-8"><button class="btn btn-secondary" onclick="App.closeTicket(\''+t.id+'\')">Close Ticket</button></div>',
      ()=>{
        const reply = ($("#adminReply")?.value||"").trim();
        if(!reply) return Toast.show("Type a reply","error");
        t.messages.push({from:"admin",text:reply,at:Date.now()});
        Notify.push(t.userId,"Ticket reply","Admin replied to: "+t.subject,"\ud83d\udce9");
        DB.save(); Toast.show("Reply sent","success"); this.closeModal(); this.render();
      });
  },
  closeTicket(id){
    const t = DB.data.tickets.find(x=>x.id===id); if(!t) return;
    t.status="closed"; DB.save(); Toast.show("Ticket closed","success"); this.closeModal(); this.render();
  },
  adminBroadcast(){
    return '<div class="glass" style="padding:16px">'+
      '<div class="field"><label class="field-label">Title</label><div class="input-wrap"><input id="bc_title" placeholder="Announcement" /></div></div>'+
      '<div class="field"><label class="field-label">Message</label><div class="input-wrap"><textarea id="bc_body" rows="3" style="resize:vertical"></textarea></div></div>'+
      '<button class="btn btn-primary" onclick="App.sendBroadcast()">Send to all users</button></div>';
  },
  sendBroadcast(){
    const t = ($("#bc_title")?.value||"").trim(), b = ($("#bc_body")?.value||"").trim();
    if(!t||!b) return Toast.show("Fill both","error");
    Notify.broadcast(t,b);
    Toast.show("Broadcast sent to "+DB.data.users.length+" users","success");
  },
  adminSettings(){
    const s = DB.data.settings;
    return '<div class="glass" style="padding:16px">'+
      '<label style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">'+
        '<span>Maintenance mode</span>'+
        '<input type="checkbox" '+(s.maintenance?"checked":"")+' onchange="DB.data.settings.maintenance=this.checked;DB.save();Toast.show(\'Saved\',\'success\')" style="width:auto" /></label>'+
      '<div class="divider"></div>'+
      '<div class="field"><label class="field-label">Referral bonus ($)</label><div class="input-wrap"><input id="ref_bonus" type="number" step="0.1" value="'+(s.referralBonus||1)+'" onchange="DB.data.settings.referralBonus=parseFloat(this.value)||1;DB.save()" /></div></div>'+
      '<button class="btn btn-secondary mt-12" onclick="App.resetFlash()">Reset flash sale timer (24h)</button>'+
      '<button class="btn btn-danger mt-12" onclick="if(confirm(\'Erase ALL data?\')){localStorage.clear();location.reload()}">Wipe all data</button></div>';
  },
  resetFlash(){ DB.data.settings.flashEnd = Date.now()+1000*60*60*24; DB.save(); Toast.show("Reset","success"); },

  /* ---------- MODAL ---------- */
  openModal(title, body, onSave, hideCancel){
    this.closeModal();
    const m = document.createElement("div");
    m.className="modal-backdrop";
    m.innerHTML = '<div class="modal">'+
      '<div class="modal-head"><div class="modal-title">'+esc(title)+'</div><button class="close-btn" onclick="App.closeModal()">\u2715</button></div>'+
      '<div class="modal-body">'+body+'</div>'+
      (onSave||!hideCancel?'<div class="modal-foot">'+
        (!hideCancel?'<button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>':'')+
        (onSave?'<button class="btn btn-primary" id="modalSave">Save</button>':'')+
        (!onSave&&hideCancel?'<button class="btn btn-primary" onclick="App.closeModal()">Close</button>':'')+
      '</div>':'<div class="modal-foot"><button class="btn btn-primary" onclick="App.closeModal();App.go(\'orders\')">View Orders</button></div>');
    m.addEventListener("click",e=>{ if(e.target===m) this.closeModal(); });
    document.body.appendChild(m);
    this.modal = m;
    if(onSave) document.getElementById("modalSave").onclick = onSave;
  },
  closeModal(){ if(this.modal){ this.modal.remove(); this.modal=null; } }
};

document.addEventListener("DOMContentLoaded",()=>{
  try{ App.init(); }
  catch(e){ console.error(e); document.getElementById("loader").classList.add("hide"); document.getElementById("root").innerHTML = '<div class="empty"><div class="empty-icon">\u26a0\ufe0f</div><p>Load error: '+esc(e.message)+'</p><button class="btn btn-secondary mt-12" onclick="localStorage.clear();location.reload()" style="max-width:200px;margin:12px auto">Reset & reload</button></div>'; }
});

window.App = App;
window.Session = Session;
window.DB = DB;
window.Toast = Toast;
</script>

<script>
(function(){

const container =
document.getElementById(
"goldParticles"
);

if(!container) return;

for(let i=0;i<55;i++){

const p =
document.createElement("span");

p.className = "particle";

const size =
Math.random()*8 + 2;

p.style.width =
size+"px";

p.style.height =
size+"px";

p.style.left =
Math.random()*100+"%";

p.style.bottom =
"-20px";

p.style.animationDuration =
(Math.random()*12+8)+"s";

p.style.animationDelay =
Math.random()*10+"s";

container.appendChild(p);
}

})();
</script>

</body>
</html>
