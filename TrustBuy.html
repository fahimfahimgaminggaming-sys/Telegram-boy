<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="TrustBuy - Premium digital marketplace with instant delivery" />
<title>TrustBuy.com — Premium Digital Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='Inter,sans-serif' font-size='32' font-weight='800' fill='%23d4af37' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#000;
  --bg-2:#0a0a0a;
  --surface:rgba(20,20,22,.72);
  --surface-2:rgba(28,28,32,.78);
  --border:rgba(255,255,255,.08);
  --border-2:rgba(212,175,55,.22);
  --text:#f5f5f7;
  --text-2:#a1a1a6;
  --muted:#6e6e73;
  --gold:#d4af37;
  --gold-2:#f0d78c;
  --gold-soft:rgba(212,175,55,.12);
  --danger:#ff453a;
  --success:#30d158;
  --info:#0a84ff;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body{background:radial-gradient(1200px 800px at 80% -10%,rgba(212,175,55,.08),transparent 60%),radial-gradient(900px 600px at -10% 100%,rgba(212,175,55,.05),transparent 60%),#000;padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:transparent;border:none;outline:none;width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* Loading */
#loader{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s var(--ease)}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{font-size:42px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px;animation:pulse 1.6s ease-in-out infinite}
.loader-ring{width:42px;height:42px;border:2px solid rgba(212,175,55,.18);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* Glass */
.glass{background:var(--surface);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius)}
.glass-gold{background:var(--surface);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border-2);border-radius:var(--radius)}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(0,0,0,.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1c1c1e,#000);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;border:1px solid var(--border-2);box-shadow:0 4px 20px rgba(212,175,55,.15)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);transition:transform .2s var(--ease),background .2s}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #000}
.icon-wrap{position:relative}

/* Main */
.app{padding:18px 18px 110px;max-width:1100px;margin:0 auto;animation:fadeIn .4s var(--ease)}
.page{animation:fadeUp .35s var(--ease)}

/* Hero / banner slider */
.hero{border-radius:22px;overflow:hidden;position:relative;margin-bottom:22px;aspect-ratio:16/8;background:linear-gradient(135deg,#1a1a1f,#0a0a0a);border:1px solid var(--border-2)}
.hero-slides{display:flex;transition:transform .6s var(--ease);height:100%}
.hero-slide{min-width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;position:relative;background-size:cover;background-position:center}
.hero-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85))}
.hero-slide>*{position:relative;z-index:1}
.hero-tag{display:inline-block;padding:6px 12px;background:rgba(212,175,55,.18);border:1px solid var(--border-2);border-radius:999px;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;width:fit-content}
.hero-title{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-.5px;margin:0 0 6px;max-width:80%}
.hero-sub{color:var(--text-2);font-size:14px;margin:0;max-width:80%}
.hero-dots{position:absolute;bottom:14px;right:18px;display:flex;gap:6px;z-index:2}
.hero-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:all .3s}
.hero-dot.active{width:22px;background:var(--gold)}

/* Flash sale */
.flash{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:18px;border-radius:16px;background:linear-gradient(135deg,rgba(255,69,58,.15),rgba(212,175,55,.08));border:1px solid rgba(255,69,58,.25)}
.flash-left{display:flex;align-items:center;gap:10px}
.flash-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,69,58,.2);font-size:18px}
.flash-title{font-weight:700;font-size:14px}
.flash-sub{font-size:12px;color:var(--text-2)}
.flash-timer{display:flex;gap:4px}
.flash-cell{background:#000;border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:34px;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 14px}
.section-title{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0}
.section-link{font-size:13px;color:var(--gold);font-weight:500}

/* Search */
.search-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:18px}
.search-bar svg{flex:0 0 18px;color:var(--text-2)}
.search-bar input{flex:1;font-size:15px}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .2s var(--ease);white-space:nowrap}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.chip:active{transform:scale(.95)}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),border-color .25s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--border-2)}
.card-img{aspect-ratio:1;background:#111 center/cover no-repeat;position:relative;overflow:hidden}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.4))}
.card-fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .2s}
.card-fav.active{color:var(--danger)}
.card-fav:active{transform:scale(.85)}
.card-stock{position:absolute;top:8px;left:8px;padding:4px 8px;background:rgba(48,209,88,.2);border:1px solid rgba(48,209,88,.4);border-radius:8px;font-size:10px;font-weight:600;color:var(--success);z-index:2}
.card-stock.out{background:rgba(255,69,58,.2);border-color:rgba(255,69,58,.4);color:var(--danger)}
.card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-size:14px;font-weight:600;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.card-rating{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2)}
.card-rating .star{color:var(--gold)}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.card-price{font-size:16px;font-weight:700;color:var(--gold)}
.card-price small{font-size:11px;color:var(--muted);font-weight:400;text-decoration:line-through;margin-left:4px}
.add-btn{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;transition:transform .15s}
.add-btn:active{transform:scale(.85)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(10,10,10,.85);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--border)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--text-2);font-size:10px;font-weight:500;border-radius:12px;transition:color .2s;position:relative}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px}
.nav-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--gold);border-radius:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .15s var(--ease),opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;box-shadow:0 6px 24px rgba(212,175,55,.3)}
.btn-secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:rgba(255,69,58,.15);border:1px solid rgba(255,69,58,.35);color:var(--danger)}
.btn-success{background:rgba(48,209,88,.15);border:1px solid rgba(48,209,88,.35);color:var(--success)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn:disabled{opacity:.5;pointer-events:none}

/* Auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .5s var(--ease)}
.auth-card{width:100%;max-width:420px;padding:32px 26px;border-radius:24px}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .brand-mark{margin:0 auto 14px;width:54px;height:54px;font-size:24px;border-radius:14px}
.auth-logo h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
.auth-logo p{color:var(--text-2);font-size:14px;margin:0}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-2);transition:all .25s}
.auth-tab.active{background:var(--gold);color:#000}
.field{margin-bottom:14px}
.field-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500;padding-left:4px}
.input-wrap{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:border-color .2s}
.input-wrap:focus-within{border-color:var(--gold)}
.input-wrap svg{flex:0 0 18px;color:var(--text-2)}
.eye-btn{flex:0 0 auto;color:var(--text-2);padding:2px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s var(--ease)}
@media(min-width:640px){.modal-backdrop{align-items:center}}
.modal{width:100%;max-width:520px;max-height:90vh;background:#0e0e10;border:1px solid var(--border);border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .35s var(--ease)}
@media(min-width:640px){.modal{border-radius:24px;animation:scaleIn .25s var(--ease)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700;margin:0}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.close-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2)}

/* Toast */
#toast-host{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{padding:13px 16px;border-radius:14px;background:rgba(20,20,22,.95);backdrop-filter:blur(20px);border:1px solid var(--border);font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fadeUp .3s var(--ease);display:flex;align-items:center;gap:10px}
.toast.success{border-color:rgba(48,209,88,.4);color:var(--success)}
.toast.error{border-color:rgba(255,69,58,.4);color:var(--danger)}
.toast.info{border-color:var(--border-2);color:var(--gold)}

/* Wallet */
.wallet-card{padding:24px;border-radius:22px;background:linear-gradient(135deg,#1a1a1f 0%,#0a0a0a 100%);border:1px solid var(--border-2);position:relative;overflow:hidden;margin-bottom:18px}
.wallet-card::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%);top:-80px;right:-60px}
.wallet-label{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px;position:relative}
.wallet-bal{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px;position:relative;margin-bottom:14px}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}

/* Crypto methods */
.crypto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.crypto-item{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);text-align:center;transition:all .2s var(--ease)}
.crypto-item:hover{border-color:var(--border-2);transform:translateY(-2px)}
.crypto-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;color:#fff}
.crypto-name{font-weight:700;font-size:13px}
.crypto-net{font-size:11px;color:var(--text-2);margin-top:2px}

/* Deposit page */
.deposit-warn{padding:12px 14px;border-radius:12px;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.3);color:#ff9f0a;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.qr-box{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:18px;margin:14px auto;width:fit-content}
.addr-box{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;word-break:break-all;font-family:'SF Mono',Menlo,monospace;font-size:12px}
.copy-btn{flex:0 0 auto;padding:8px 12px;background:var(--gold);color:#000;border-radius:8px;font-weight:600;font-size:12px}
.upload-zone{padding:24px;border:2px dashed var(--border);border-radius:14px;text-align:center;color:var(--text-2);font-size:13px;cursor:pointer;transition:border-color .2s;margin-bottom:12px}
.upload-zone:hover{border-color:var(--gold);color:var(--gold)}
.upload-zone img{margin:10px auto 0;max-width:200px;max-height:200px;border-radius:10px}

/* Order/list items */
.list-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}
.list-img{width:54px;height:54px;border-radius:12px;background:#222 center/cover;flex:0 0 54px}
.list-body{flex:1;min-width:0}
.list-title{font-weight:600;font-size:14px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:var(--text-2)}
.status-pill{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.status-pending{background:rgba(255,159,10,.15);color:#ff9f0a}
.status-completed,.status-approved,.status-delivered{background:rgba(48,209,88,.15);color:var(--success)}
.status-rejected,.status-cancelled,.status-banned{background:rgba(255,69,58,.15);color:var(--danger)}
.status-processing{background:rgba(10,132,255,.15);color:var(--info)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px}
.stat-val{font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat-val.gold{color:var(--gold)}

/* Chart */
.chart-wrap{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--border);margin-bottom:18px}
.chart-svg{width:100%;height:180px}

/* Profile */
.profile-head{display:flex;align-items:center;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:18px;margin-bottom:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#000;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.menu-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;transition:background .2s;text-align:left;width:100%}
.menu-item:hover{background:var(--surface-2)}
.menu-item svg{flex:0 0 20px;color:var(--gold)}
.menu-item-text{flex:1}
.menu-item-arr{color:var(--text-2)}

/* Cart */
.cart-foot{position:sticky;bottom:80px;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);padding:14px;border:1px solid var(--border);border-radius:18px;margin-top:14px}
.cart-total{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:8px}
.cart-total.grand{font-size:18px;color:var(--text);font-weight:700;margin-bottom:12px}

/* Chat */

.chat-panel{position:fixed;bottom:160px;right:18px;width:300px;max-width:calc(100vw - 36px);max-height:420px;background:#0e0e10;border:1px solid var(--border);border-radius:18px;z-index:55;display:none;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}

.chat-msgs{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.chat-msg{padding:8px 12px;border-radius:14px;max-width:80%}
.chat-msg.bot{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.me{background:var(--gold);color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.chat-input{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input input{flex:1;padding:8px 12px;background:var(--surface-2);border-radius:10px;font-size:13px}

/* Maintenance */
.maint{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.maint-card{max-width:400px}
.maint-icon{font-size:64px;margin-bottom:18px}
.maint h2{font-size:24px;margin:0 0 8px;letter-spacing:-.5px}
.maint p{color:var(--text-2);font-size:14px}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-icon{font-size:54px;opacity:.5;margin-bottom:14px}
.empty p{margin:6px 0;font-size:14px}

/* Tabs (admin etc) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text-2);font-weight:500;white-space:nowrap;flex:0 0 auto}
.tab.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}

/* Product detail */
.pd-img{width:100%;aspect-ratio:1;background:#111 center/cover;border-radius:18px;margin-bottom:14px}
.pd-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px}
.pd-price{font-size:28px;font-weight:800;color:var(--gold);margin:8px 0}
.pd-desc{color:var(--text-2);font-size:14px;line-height:1.55;margin:12px 0}
.review-item{padding:12px;background:var(--surface-2);border-radius:12px;margin-bottom:8px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.review-name{font-weight:600;font-size:13px}
.review-stars{color:var(--gold);font-size:12px}
.review-text{font-size:13px;color:var(--text-2);line-height:1.5}
.stars-input{display:flex;gap:4px;font-size:24px;cursor:pointer;color:#444;margin-bottom:10px}
.stars-input span.on{color:var(--gold)}

.text-c{text-align:center}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.fz12{font-size:12px}.fz14{font-size:14px}
.muted{color:var(--text-2)}
.gold{color:var(--gold)}
.divider{height:1px;background:var(--border);margin:18px 0}
.hidden{display:none!important}

};

    return `<nav class="bottom-nav">${items.map(([r,l,svg])=>`
      <button class="nav-item ${this.route===r?"active":""}" onclick="App.go('${r}')">${svg}<span>${l}</span></button>`).join("")}</nav>`;
  },

  renderPage(){
    switch(this.route){
      case "home": return this.pageHome();
      case "shop": return this.pageShop();
      case "wishlist": return this.pageWishlist();
      case "wallet": return this.pageWallet();
      case "deposit": return this.pageDeposit();
      case "deposits": return this.pageDeposits();
      case "cart": return this.pageCart();
      case "orders": return this.pageOrders();
      case "profile": return this.pageProfile();
      case "notifications": return this.pageNotifications();
      case "product": return this.pageProduct();
      case "admin": return this.pageAdmin();
      case "referrals": return this.pageReferrals();
      default: return this.pageHome();
    }
  },

  afterRender(){
    if(this.bannerTimer) clearInterval(this.bannerTimer);
    if(this.flashTimer) clearInterval(this.flashTimer);
    if(this.route==="home"){
      this.bannerTimer = setInterval(()=>this.nextBanner(), 5000);
      this.flashTimer = setInterval(()=>this.tickFlash(), 1000);
      this.tickFlash();
    }
  },

  /* ---------- HOME ---------- */
  pageHome(){
    const d = DB.data;
    const featured = d.products.filter(p=>p.featured);
    const top = [...d.products].sort((a,b)=>(b.sold||0)-(a.sold||0)).slice(0,6);
    return `<div class="page">
      <div class="hero" id="hero">
        <div class="hero-slides" id="heroSlides">${d.banners.map(b=>`
          <div class="hero-slide" style="background-image:url('${esc(b.img||"")}')">
            <span class="hero-tag">${esc(b.tag)}</span>
            <h2 class="hero-title">${esc(b.title)}</h2>
            <p class="hero-sub">${esc(b.sub)}</p>
          </div>`).join("")}</div>
        <div class="hero-dots" id="heroDots">${d.banners.map((_,i)=>`<span class="hero-dot ${i===0?"active":""}"></span>`).join("")}</div>
      </div>
      <div class="flash">
        <div class="flash-left">
          <div class="flash-icon">⚡</div>
          <div><div class="flash-title">Flash Sale</div><div class="flash-sub">Limited time deals</div></div>
        </div>
        <div class="flash-timer" id="flashTimer"></div>
      </div>
      <div class="section-header"><h3 class="section-title">Featured</h3><a class="section-link" onclick="App.go('shop')">See all</a></div>
      <div class="grid">${featured.map(p=>this.productCard(p)).join("") || `<p class="muted">No featured products yet.</p>`}</div>
      <div class="section-header"><h3 class="section-title">Top Selling</h3><a class="section-link" onclick="App.go('shop')">See all</a></div>
      <div class="grid">${top.map(p=>this.productCard(p)).join("")}</div>
    </div>`;
  },
  nextBanner(){
    const slides = document.getElementById("heroSlides");
    const dots = document.getElementById("heroDots");
    if(!slides || !dots) return;
    const total = DB.data.banners.length;
    if(!total) return;
    this.bannerIdx = (this.bannerIdx+1)%total;
    slides.style.transform = `translateX(-${this.bannerIdx*100}%)`;
    dots.querySelectorAll(".hero-dot").forEach((d,i)=>d.classList.toggle("active",i===this.bannerIdx));
  },
  tickFlash(){
    const el = document.getElementById("flashTimer");
    if(!el) return;
    let ms = (DB.data.settings.flashEnd||0) - Date.now();
    if(ms<=0){ DB.data.settings.flashEnd = Date.now()+1000*60*60*24; DB.save(); ms = 1000*60*60*24; }
    const h = String(Math.floor(ms/3.6e6)).padStart(2,"0");
    const m = String(Math.floor(ms%3.6e6/6e4)).padStart(2,"0");
    const s = String(Math.floor(ms%6e4/1000)).padStart(2,"0");
    el.innerHTML = `<div class="flash-cell">${h}</div><div class="flash-cell">${m}</div><div class="flash-cell">${s}</div>`;
  },

  /* ---------- PRODUCT CARD ---------- */
  productCard(p){
    const u = Session.user;

    const stock = (p.stock||[]).length;
    return `<div class="card">
      <div class="card-img" style="background-image:url('${esc(p.image)}')" onclick="App.go('product','${p.id}')">
        <button class="card-fav ${fav?"active":""}" onclick="event.stopPropagation();App.toggleWish('${p.id}')" aria-label="Wishlist">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${fav?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
        <span class="card-stock ${stock?"":"out"}">${stock?stock+" in stock":"Out"}</span>
      </div>
      <div class="card-body" onclick="App.go('product','${p.id}')">
        <h4 class="card-title">${esc(p.title)}</h4>

  avgRating(pid){

      ${prods.length?`<div class="grid">${prods.map(p=>this.productCard(p)).join("")}</div>`:`<div class="empty"><div class="empty-icon">🔍</div><p>No products found</p></div>`}
    </div>`;
  },
  onSearch(v){ this.searchQ = v; const g = document.querySelector(".grid"); if(g){ const q = v.toLowerCase(); let prods = DB.data.products.filter(p=>(this.filter==="All"||p.category===this.filter) && (!q||p.title.toLowerCase().includes(q))); g.innerHTML = prods.map(p=>this.productCard(p)).join(""); } },
  setFilter(c){ this.filter = c; this.render(); },

      <div class="pd-price">${fmt(p.price)} ${p.oldPrice?`<small style="font-size:14px;text-decoration:line-through;color:var(--muted);font-weight:400">${fmt(p.oldPrice)}</small>`:""}</div>

      </div>

      <div class="divider"></div>

      <div class="mt-12">${reviews.length?reviews.map(r=>`
        <div class="review-item"><div class="review-head"><span class="review-name">${esc(r.name)}</span><span class="review-stars">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span></div><div class="review-text">${esc(r.text)}</div></div>`).join(""):`<p class="muted fz14">No reviews yet. Be the first.</p>`}</div>
      <div class="glass mt-16" style="padding:14px">
        <h4 style="margin:0 0 10px;font-size:14px">Leave a review</h4>
        <div class="stars-input" id="starsIn">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="App.setStar(${n})">★</span>`).join("")}</div>
        <textarea id="revText" placeholder="Share your experience..." rows="3" style="padding:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;resize:vertical"></textarea>
        <button class="btn btn-primary mt-8" onclick="App.submitReview('${p.id}')">Submit</button>
      </div>
    </div>`;
  },
  _star: 5,
  setStar(n){ this._star = n; document.querySelectorAll("#starsIn span").forEach((s,i)=>s.classList.toggle("on",i<n)); },
  submitReview(pid){
    const t = $("#revText").value.trim();
    if(!t) return Toast.show("Write something","error");
    DB.data.reviews[pid] = DB.data.reviews[pid]||[];
    DB.data.reviews[pid].unshift({ name:Session.user.name, stars:this._star||5, text:t, at:Date.now() });
    DB.save();
    Toast.show("Review posted","success");
    this.render();
  },

  /* ---------- WISHLIST ---------- */
  toggleWish(pid){
    const u = Session.user;
    DB.data.wishlist[u.id] ||= [];
    const arr = DB.data.wishlist[u.id];
    const i = arr.indexOf(pid);
    if(i>=0){ arr.splice(i,1); Toast.show("Removed from wishlist"); }
    else { arr.push(pid); Toast.show("Added to wishlist","success"); }
    DB.save();
    if(this.route==="wishlist"||this.route==="shop"||this.route==="home") this.render();
    else { const card = event?.target?.closest(".card"); if(card){ const fav = card.querySelector(".card-fav"); fav?.classList.toggle("active"); } }
  },
  pageWishlist(){
    const u = Session.user;
    const ids = DB.data.wishlist[u.id]||[];
    const items = DB.data.products.filter(p=>ids.includes(p.id));
    return `<div class="page">
      <h2 class="section-title mb-16">My Wishlist</h2>
      ${items.length?`<div class="grid">${items.map(p=>this.productCard(p)).join("")}</div>`:`<div class="empty"><div class="empty-icon">♡</div><p>Your wishlist is empty</p></div>`}
    </div>`;
  },

  /* ---------- CART ---------- */
  addToCart(pid){
    const u = Session.user;
    DB.data.cart[u.id] ||= [];
    const c = DB.data.cart[u.id];
    const ex = c.find(x=>x.pid===pid);
    if(ex) ex.qty++; else c.push({ pid, qty:1 });
    DB.save();
    Toast.show("Added to cart","success");
    this.render();
  },
  changeQty(pid,d){
    const u = Session.user;
    const c = DB.data.cart[u.id]||[];
    const it = c.find(x=>x.pid===pid); if(!it) return;
    it.qty += d;
    if(it.qty<=0) DB.data.cart[u.id] = c.filter(x=>x.pid!==pid);
    DB.save(); this.render();
  },
  pageCart(){
    const u = Session.user;
    const c = DB.data.cart[u.id]||[];
    const items = c.map(x=>({...x, p: DB.data.products.find(p=>p.id===x.pid)})).filter(x=>x.p);
    let subtotal = items.reduce((a,x)=>a+x.p.price*x.qty,0);
    const cp = this._coupon;
    let discount = 0;
    if(cp){ discount = subtotal*cp.percent/100; }
    const total = subtotal-discount;
    return `<div class="page">
      <h2 class="section-title mb-16">Cart</h2>
      ${items.length?`
        ${items.map(it=>`
          <div class="list-item">
            <div class="list-img" style="background-image:url('${esc(it.p.image)}')"></div>
            <div class="list-body">
              <p class="list-title">${esc(it.p.title)}</p>
              <p class="list-sub">${fmt(it.p.price)} × ${it.qty} = <span class="gold">${fmt(it.p.price*it.qty)}</span></p>
            </div>
            <div class="row" style="flex:0 0 auto;gap:4px">
              <button class="add-btn" style="background:var(--surface-2);color:var(--text)" onclick="App.changeQty('${it.pid}',-1)">−</button>
              <button class="add-btn" onclick="App.changeQty('${it.pid}',1)">+</button>
            </div>
          </div>`).join("")}
        <div class="row mt-12">
          <input id="couponIn" placeholder="Coupon code" style="padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px" />
          <button class="btn btn-secondary" style="flex:0 0 auto" onclick="App.applyCoupon()">Apply</button>
        </div>
        <div class="cart-foot">
          <div class="cart-total"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
          ${discount?`<div class="cart-total"><span>Discount (${cp.code})</span><span class="gold">−${fmt(discount)}</span></div>`:""}
          <div class="cart-total grand"><span>Total</span><span>${fmt(total)}</span></div>
          <button class="btn btn-primary" onclick="App.checkout()">Checkout & Get Accounts</button>
        </div>
      `:`<div class="empty"><div class="empty-icon">🛒</div><p>Your cart is empty</p><button class="btn btn-primary mt-12" onclick="App.go('shop')" style="max-width:200px;margin:12px auto">Browse Shop</button></div>`}
    </div>`;
  },
  _coupon:null,
  applyCoupon(){
    const v = $("#couponIn").value.trim().toUpperCase();
    const c = DB.data.coupons.find(x=>x.code===v && x.active);
    if(!c){ this._coupon=null; return Toast.show("Invalid coupon","error"); }
    this._coupon = c;
    Toast.show(`${c.percent}% off applied`,"success");
    this.render();
  },
  checkout(){
    const u = Session.user;
    const c = DB.data.cart[u.id]||[];
    const items = c.map(x=>({...x, p: DB.data.products.find(p=>p.id===x.pid)})).filter(x=>x.p);
    if(!items.length) return Toast.show("Cart empty","error");
    let subtotal = items.reduce((a,x)=>a+x.p.price*x.qty,0);
    let discount = this._coupon ? subtotal*this._coupon.percent/100 : 0;
    let total = subtotal-discount;
    if(u.balance < total) return Toast.show("Insufficient wallet balance. Deposit first.","error");
    // verify stock
    for(const it of items){ if((it.p.stock||[]).length < it.qty) return Toast.show("Not enough stock for "+it.p.title,"error"); }
    // deduct + deliver
    u.balance -= total;
    const delivered = [];
    items.forEach(it=>{
      for(let i=0;i<it.qty;i++){
        const acc = it.p.stock.shift();
        delivered.push({ pid:it.p.id, title:it.p.title, account:acc });
      }
      it.p.sold = (it.p.sold||0) + it.qty;
    });
    const order = { id:"o"+Date.now(), userId:u.id, items:delivered, total, status:"delivered", at:Date.now(), coupon:this._coupon?.code||null };
    DB.data.orders.unshift(order);
    DB.data.cart[u.id] = [];
    this._coupon = null;
    Notify.push(u.id,"Order delivered","Your accounts are ready in Orders.");
    DB.save();
    Toast.show("Order completed! Accounts delivered.","success");
    this.go("orders");
  },

    const orders = DB.data.orders.filter(o=>o.userId===u.id);
    return `<div class="page">

  copyText(t){ navigator.clipboard?.writeText(t).then(()=>Toast.show("Copied","success")).catch(()=>{ const ta = document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} ta.remove(); Toast.show("Copied","success"); }); },
  buyNow(pid){

    DB.data.cart[u.id] = [{pid, qty:1}];

  },

  /* ---------- WALLET ---------- */
  pageWallet(){

      <div class="wallet-card">
        <div class="wallet-label">Wallet balance</div>
        <div class="wallet-bal">${fmt(u.balance)}</div>
        <div class="wallet-actions">

  /* ---------- DEPOSIT ---------- */
  _crypto:"bep20",
  pageDeposit(){
    const w = WALLETS.find(x=>x.id===this._crypto) || WALLETS[0];
    return `<div class="page">
      <button class="btn btn-ghost mb-12" onclick="App.go('wallet')">← Back to wallet</button>
      <h2 class="section-title mb-12">Crypto Deposit</h2>
      <div class="filter-chips mb-12">${WALLETS.map(x=>`<button class="chip ${x.id===this._crypto?"active":""}" onclick="App.selectCrypto('${x.id}')">${esc(x.name)}</button>`).join("")}</div>
      <div class="glass" style="padding:16px">
        <div class="deposit-warn">⚠️ ${esc(w.warn)} Network: <b>${esc(w.net)}</b></div>

        <div class="qr-box" id="qrBox"></div>
        <label class="field-label">Wallet address</label>
        <div class="addr-box"><span style="flex:1">${esc(w.addr)}</span><button class="copy-btn" onclick="App.copyText('${esc(w.addr)}')">Copy</button></div>
        <label class="field-label mt-12">Deposit amount (USD)</label>
        <div class="input-wrap"><input id="depAmt" type="number" min="1" step="0.01" placeholder="e.g. 25.00" /></div>

          <input type="file" id="depFile" accept="image/*" hidden onchange="App.previewDepImg(event)" />
        </label>
        <button class="btn btn-primary mt-12" onclick="App.submitDeposit()">Submit deposit</button>
      </div>
    </div>`;
  },
  selectCrypto(id){
    this._crypto = id;
    this.render();
    setTimeout(()=>this.renderQR(), 50);
  },
  renderQR(){
    const w = WALLETS.find(x=>x.id===this._crypto)||WALLETS[0];
    const box = document.getElementById("qrBox");
    if(!box) return;
    box.innerHTML = "";
    try{
      new QRCode(box, { text:w.addr, width:180, height:180, colorDark:"#000", colorLight:"#fff", correctLevel:QRCode.CorrectLevel.M });
    }catch(e){
      box.innerHTML = `<div style="padding:30px;color:#000">QR unavailable</div>`;
    }
  },
  _depImg:null,
  previewDepImg(e){
    const f = e.target.files?.[0]; if(!f) return;
    if(f.size>2*1024*1024) return Toast.show("Image too large (max 2MB)","error");
    const r = new FileReader();
    r.onload = ev=>{
      this._depImg = ev.target.result;
      const z = document.getElementById("depZone");
      z.innerHTML = `<div>✓ Uploaded</div><img src="${this._depImg}" alt="proof" />`;
    };
    r.readAsDataURL(f);
  },
  submitDeposit(){
    const amt = parseFloat($("#depAmt").value);
    if(!amt||amt<=0) return Toast.show("Enter amount","error");
    if(!this._depImg) return Toast.show("Upload payment screenshot","error");
    const w = WALLETS.find(x=>x.id===this._crypto);
    const dep = { id:"d"+Date.now(), userId:Session.user.id, amount:amt, method:w.name, address:w.addr, proof:this._depImg, status:"pending", at:Date.now() };
    DB.data.deposits.unshift(dep);
    DB.save();
    this._depImg = null;
    Notify.push(Session.user.id,"Deposit submitted","We're verifying your payment.");
    Toast.show("Deposit submitted, awaiting approval","success");
    this.go("deposits");
  },
  pageDeposits(){
    const u = Session.user;
    const deps = DB.data.deposits.filter(d=>d.userId===u.id);
    return `<div class="page">

  _adminTab:"dash",
  pageAdmin(){
    if(Session.user.role!=="admin") return `<div class="empty">Access denied</div>`;
    const tabs = [["dash","Dashboard"],["prods","Products"],["orders","Orders"],["deps","Deposits"],["users","Users"],["coupons","Coupons"],["banners","Banners"],["broadcast","Broadcast"],["settings","Settings"]];
    return `<div class="page">
      <h2 class="section-title mb-12">Admin Panel</h2>
      <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${this._adminTab===k?"active":""}" onclick="App._adminTab='${k}';App.render()">${l}</button>`).join("")}</div>
      ${this.renderAdminTab()}
    </div>`;
  },
  renderAdminTab(){
    switch(this._adminTab){
      case "dash": return this.adminDash();
      case "prods": return this.adminProds();
      case "orders": return this.adminOrders();
      case "deps": return this.adminDeps();
      case "users": return this.adminUsers();
      case "coupons": return this.adminCoupons();
      case "banners": return this.adminBanners();
      case "broadcast": return this.adminBroadcast();

    }
  },
  adminDash(){
    const d = DB.data;
    const rev = d.orders.reduce((a,o)=>a+o.total,0);
    const last7 = Array.from({length:7},(_,i)=>{
      const day = new Date(); day.setHours(0,0,0,0); day.setDate(day.getDate()-(6-i));
      const next = day.getTime()+86400000;
      const v = d.orders.filter(o=>o.at>=day.getTime() && o.at<next).reduce((a,o)=>a+o.total,0);
      return { label: day.toLocaleDateString(undefined,{weekday:"short"}), v };
    });
    const max = Math.max(...last7.map(x=>x.v),1);
    const W=300, H=140, P=24;
    const pts = last7.map((p,i)=>[P+i*((W-2*P)/6), H-P-(p.v/max)*(H-2*P)]);
    const path = pts.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" ");
    return `
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Users</div><div class="stat-val">${d.users.length}</div></div>
        <div class="stat"><div class="stat-label">Orders</div><div class="stat-val">${d.orders.length}</div></div>
        <div class="stat"><div class="stat-label">Revenue</div><div class="stat-val gold">${fmt(rev)}</div></div>
        <div class="stat"><div class="stat-label">Pending Deposits</div><div class="stat-val">${d.deposits.filter(x=>x.status==="pending").length}</div></div>
      </div>
      <div class="chart-wrap">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-weight:700">Revenue (7d)</div><div class="gold" style="font-weight:700">${fmt(last7.reduce((a,b)=>a+b.v,0))}</div></div>
        <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d4af37" stop-opacity=".5"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs>
          <path d="${path} L ${pts[pts.length-1][0]},${H-P} L ${pts[0][0]},${H-P} Z" fill="url(#g1)"/>
          <path d="${path}" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linejoin="round"/>
          ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#d4af37"/>`).join("")}
          ${last7.map((p,i)=>`<text x="${P+i*((W-2*P)/6)}" y="${H-6}" fill="#888" font-size="10" text-anchor="middle">${p.label}</text>`).join("")}
        </svg>
      </div>`;
  },
  adminProds(){

      ${DB.data.products.map(p=>`
        <div class="list-item">

            <p class="list-title">${esc(p.title)}</p>

  editProduct(id){

      <label style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
        <span>Maintenance mode</span>
        <input type="checkbox" ${s.maintenance?"checked":""} onchange="DB.data.settings.maintenance=this.checked;DB.save();Toast.show('Saved','success')" style="width:auto" />
      </label>
      <div class="divider"></div>
      <div class="field"><label class="field-label">Referral bonus ($)</label><div class="input-wrap"><input id="ref_bonus" type="number" step="0.1" value="${s.referralBonus||1}" onchange="DB.data.settings.referralBonus=parseFloat(this.value)||1;DB.save()" /></div></div>
      <button class="btn btn-secondary mt-12" onclick="App.resetFlash()">Reset flash sale timer (24h)</button>
      <button class="btn btn-danger mt-12" onclick="if(confirm('Erase ALL data?')){localStorage.clear();location.reload()}">Wipe all data</button>
    </div>`;
  },
  resetFlash(){ DB.data.settings.flashEnd = Date.now()+1000*60*60*24; DB.save(); Toast.show("Reset","success"); },

  /* ---------- MODAL ---------- */
  openModal(title, body, onSave){
    this.closeModal();
    const m = document.createElement("div");
    m.className="modal-backdrop";
    m.innerHTML = `<div class="modal">
      <div class="modal-head"><div class="modal-title">${esc(title)}</div><button class="close-btn" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modalSave">Save</button>
      </div>
    </div>`;
    m.addEventListener("click",e=>{ if(e.target===m) this.closeModal(); });
    document.body.appendChild(m);
    this.modal = m;
    document.getElementById("modalSave").onclick = onSave;
  },
  closeModal(){ if(this.modal){ this.modal.remove(); this.modal=null; } }
};

document.addEventListener("DOMContentLoaded",()=>{
  try{ App.init(); }
  catch(e){ console.error(e); document.getElementById("loader").classList.add("hide"); document.getElementById("root").innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Load error: ${esc(e.message)}</p><button class="btn btn-secondary mt-12" onclick="localStorage.clear();location.reload()" style="max-width:200px;margin:12px auto">Reset & reload</button></div>`; }
});

// expose for inline handlers
window.App = App;
window.Session = Session;
window.DB = DB;
window.Toast = Toast;
</script>
</body>
</html>
